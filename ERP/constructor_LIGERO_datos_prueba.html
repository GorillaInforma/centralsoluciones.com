    <div className="space-y-4">
      <DashboardKpis title="Notas de crédito y devoluciones" items={[
        { label: "Notas activas", value: activas.length, Icon: FileText },
        { label: "Total devuelto/acreditado", value: fmtMoney2(totalDevuelto), Icon: TriangleAlert, tone: "warn" },
        { label: "Facturas afectadas", value: new Set(activas.map((n) => n.facturaId)).size, Icon: DollarSign },

        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Nueva nota de crédito — reduce en cascada la cuenta por cobrar de la factura</h3>
        <div className="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
          <label className="flex flex-col gap-1.5 md:col-span-2">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Factura</span>

              <option value="">— Selecciona factura —</option>

          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Motivo</span>
            <input value={form.motivo} onChange={(e) => set("motivo", e.target.value)} placeholder="Devolución, descuento post-venta..." className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
        </div>
        <button onClick={agregar} disabled={!form.facturaId || !Number(form.monto)} className="mt-3 px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition flex items-center gap-1.5 disabled:opacity-40">
          <Plus className="w-4 h-4" /> Emitir nota de crédito

      <div className="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-200 bg-zinc-50/50">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase">Notas emitidas</h3>
        </div>
        {notasCredito.length === 0 && <div className="p-6 text-center text-[13px] text-zinc-500">Sin notas de crédito todavía.</div>}
        {notasCredito.map((n) => (
          <div key={n.id} className="px-4 py-2.5 border-b border-zinc-100 flex items-center justify-between text-[12px] gap-3">
            <div className="min-w-0">
              <div className="font-medium truncate">{n.cliente} {n.motivo && <span className="text-[11px] text-zinc-500">— {n.motivo}</span>}</div>
              <div className="text-[11px] text-zinc-500">{fmtFecha(n.fechaCreacion)}</div>

              <span className="mono font-semibold text-red-600">−{fmtMoney2(n.monto)}</span>

function VentasComisionesSub({ vendedores, setVendedores, facturasVenta, notasCredito }) {
  const vacio = { nombre: "", pctComision: 5, metaMensual: 0 };
  const [form, setForm] = useState(vacio);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const notaPorFactura = (facturaId) => notasCredito.filter((n) => n.facturaId === facturaId && n.estado === "activo").reduce((s, n) => s + n.monto, 0);
  const facturadoCobradoPorVendedor = {};
  facturasVenta.forEach((f) => {
    if (f.estado === "activo" && f.estadoComercial === "Cobrada" && f.vendedor) {
      facturadoCobradoPorVendedor[f.vendedor] = (facturadoCobradoPorVendedor[f.vendedor] || 0) + (f.total - notaPorFactura(f.id));
    }
  });

  const agregar = () => {
    if (!form.nombre.trim()) return;
    setVendedores((prev) => [crearRegistro({ nombre: form.nombre.trim(), pctComision: Number(form.pctComision) || 0, metaMensual: Number(form.metaMensual) || 0 }, `Vendedor "${form.nombre.trim()}" registrado`), ...prev]);
    setForm(vacio);
  };

  const activos = vendedores.filter((v) => v.estado === "activo");
  const totalComisiones = activos.reduce((s, v) => s + (facturadoCobradoPorVendedor[v.nombre] || 0) * (v.pctComision / 100), 0);

  return (
    <div className="space-y-4">
      <DashboardKpis title="Comisiones y cuotas" items={[
        { label: "Vendedores activos", value: activos.length, Icon: Users },
        { label: "Comisiones devengadas (cobrado)", value: fmtMoney2(totalComisiones), Icon: BadgePercent, tone: "dark" },
        { label: "Facturado y cobrado con vendedor", value: fmtMoney2(Object.values(facturadoCobradoPorVendedor).reduce((s, v) => s + v, 0)), Icon: DollarSign },
        { label: "Facturas sin vendedor asignado", value: facturasVenta.filter((f) => f.estado === "activo" && !f.vendedor).length, Icon: TriangleAlert },
      ]} />

      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Alta de vendedor</h3>
        <div className="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
          <label className="flex flex-col gap-1.5 md:col-span-2">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Nombre (debe coincidir con "vendedor" en la cotización)</span>
            <input value={form.nombre} onChange={(e) => set("nombre", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">% Comisión</span>
            <input type="number" step="0.5" value={form.pctComision} onChange={(e) => set("pctComision", Number(e.target.value))} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Meta mensual</span>
            <input type="number" step="100" value={form.metaMensual} onChange={(e) => set("metaMensual", Number(e.target.value))} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
          </label>
        </div>
        <button onClick={agregar} disabled={!form.nombre.trim()} className="mt-3 px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition flex items-center gap-1.5 disabled:opacity-40">
          <Plus className="w-4 h-4" /> Registrar vendedor
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-200 bg-zinc-50/50">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase">Vendedores y su comisión en vivo</h3>
        </div>
        {vendedores.length === 0 && <div className="p-6 text-center text-[13px] text-zinc-500">Sin vendedores todavía.</div>}
        {vendedores.map((v) => {
          const facturado = facturadoCobradoPorVendedor[v.nombre] || 0;
          const comision = facturado * (v.pctComision / 100);
          const avanceMeta = v.metaMensual > 0 ? (facturado / v.metaMensual) * 100 : 0;
          return (
            <div key={v.id} className="px-4 py-2.5 border-b border-zinc-100 flex items-center justify-between text-[12px] gap-3">
              <div className="min-w-0">
                <div className="font-medium truncate">{v.nombre} <span className="text-[10px] px-2 py-0.5 rounded-full bg-zinc-100 border border-zinc-200 ml-1">{v.pctComision}%</span></div>
                <div className="text-[11px] text-zinc-500">Facturado cobrado {fmtMoney2(facturado)} · {v.metaMensual ? `${fmtNum(avanceMeta)}% de meta` : "sin meta"}</div>
              </div>
              <div className="flex items-center gap-2">
                <span className="mono font-semibold">{fmtMoney2(comision)}</span>
                <AccionesRegistro
                  registro={v}
                  onCancelar={() => aplicarAccion(setVendedores, v.id, "cancelar", null, `Vendedor "${v.nombre}" desactivado`)}
                  onBorrar={() => aplicarAccion(setVendedores, v.id, "borrar", null, `Vendedor "${v.nombre}" eliminado`)}
                  onRestaurar={() => aplicarAccion(setVendedores, v.id, "restaurar", null, `Vendedor "${v.nombre}" restaurado`)}
                />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const VENTAS_SUB_LABELS = ["Clientes", "Cotizaciones", "Pedidos", "Facturación", "Notas de crédito", "Comisiones"];

function VentasModule({ subIndex, productos, stats, clientes, setClientes, cotizaciones, setCotizaciones, pedidosVenta, setPedidosVenta, facturasVenta, setFacturasVenta, notasCredito, setNotasCredito, vendedores, setVendedores }) {
  const crearPedidoDesdeCotizacion = (cot) => {
    setPedidosVenta((prev) => [crearRegistro({
      cotizacionId: cot.id, cliente: cot.cliente, productoNombre: cot.productoNombre,
      cantidad: cot.cantidad, total: cot.total, vendedor: cot.vendedor,
      fecha: new Date().toISOString(), estadoComercial: "Pendiente",
    }, `Pedido creado en cascada desde cotización aceptada de ${cot.cliente}`), ...prev]);
  };
  const marcarPedidoEntregado = (pedido) => {
    aplicarAccion(setPedidosVenta, pedido.id, "editar", { estadoComercial: "Entregado" }, "Pedido entregado al cliente");
    setFacturasVenta((prev) => [crearRegistro({
      pedidoId: pedido.id, cliente: pedido.cliente, productoNombre: pedido.productoNombre,
      total: pedido.total, vendedor: pedido.vendedor,
      fecha: new Date().toISOString(), estadoComercial: "Emitida",
    }, `Factura emitida en cascada al entregar el pedido de ${pedido.cliente}`), ...prev]);
  };
  const marcarFacturaCobrada = (factura) => {
    if (!factura) return;
    aplicarAccion(setFacturasVenta, factura.id, "editar", { estadoComercial: "Cobrada" }, "Cobro registrado");
  };

  return (
    <div className="max-w-[1500px] mx-auto px-4 md:px-6 py-4 space-y-4">
      <div className="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Ventas y Cotizaciones · {VENTAS_SUB_LABELS[subIndex]}</div>
      {subIndex === 0 && <VentasClientesSub clientes={clientes} setClientes={setClientes} facturasVenta={facturasVenta} />}
      {subIndex === 1 && <VentasCotizacionesSub productos={productos} stats={stats} clientes={clientes} cotizaciones={cotizaciones} setCotizaciones={setCotizaciones} crearPedidoDesdeCotizacion={crearPedidoDesdeCotizacion} />}
      {subIndex === 2 && <VentasPedidosSub pedidosVenta={pedidosVenta} setPedidosVenta={setPedidosVenta} marcarPedidoEntregado={marcarPedidoEntregado} />}
      {subIndex === 3 && <VentasFacturasSub facturasVenta={facturasVenta} setFacturasVenta={setFacturasVenta} notasCredito={notasCredito} marcarFacturaCobrada={marcarFacturaCobrada} />}
      {subIndex === 4 && <VentasNotasCreditoSub facturasVenta={facturasVenta} notasCredito={notasCredito} setNotasCredito={setNotasCredito} />}
      {subIndex === 5 && <VentasComisionesSub vendedores={vendedores} setVendedores={setVendedores} facturasVenta={facturasVenta} notasCredito={notasCredito} />}
    </div>
  );
}

/* ============================================================
   RRHH Y NÓMINA — alta de empleado genera automáticamente su
   costo de mano de obra (directa/indirecta) dentro de Costeos
   ============================================================ */
function RRHHTab({ empleados, setEmpleados, setComponents, produccionGlobal }) {
  const [form, setForm] = useState({ nombre: "", puesto: "", tipo: "Directo", salarioMensual: 0 });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const agregar = () => {
    if (!form.nombre.trim()) return;
    const componenteId = uid();
    const esDirecto = form.tipo === "Directo";
    const categoria = esDirecto ? CAT_NAMES[4] : CAT_NAMES[5]; // Mano de obra directa / indirecta y gestión
    const subcategoria = (SUBCATS[categoria] || [])[0] || "";
    const nuevoComponente = {
      id: componenteId, groupId: componenteId, incluido: true,
      categoria, subcategoria,
      concepto: `Salario de ${form.nombre} (${form.puesto || form.tipo})`,
      proveedor: "", tipo: esDirecto ? "Directo" : "Indirecto",
      costoAdquisicion: Number(form.salarioMensual) || 0,
      periodo: "Mensual", unidad: "mes", cantidadPorUnidad: 1, cantidadComprada: 1, vecesUsoPeriodo: 1,
      produccionPeriodo: produccionGlobal,
      produccionDiaria: Math.max(1, Math.round(produccionGlobal / 30)),
      fechaInicio: new Date().toISOString(),
    };
    setComponents((prev) => [nuevoComponente, ...prev]);
    setEmpleados((prev) => [{ id: uid(), nombre: form.nombre.trim(), puesto: form.puesto.trim(), tipo: form.tipo, salarioMensual: Number(form.salarioMensual) || 0, componenteId }, ...prev]);
    setForm({ nombre: "", puesto: "", tipo: "Directo", salarioMensual: 0 });
  };

  const eliminar = (emp) => {
    setEmpleados((prev) => prev.filter((e) => e.id !== emp.id));
    setComponents((prev) => prev.filter((c) => c.id !== emp.componenteId));
  };

  const nominaTotal = empleados.reduce((s, e) => s + e.salarioMensual, 0);
  const directos = empleados.filter((e) => e.tipo === "Directo").length;
  const indirectos = empleados.filter((e) => e.tipo === "Indirecto").length;
  const salarioPromedio = empleados.length ? nominaTotal / empleados.length : 0;

  return (
    <div className="max-w-[1500px] mx-auto px-4 md:px-6 py-4 space-y-4">
      <DashboardKpis
        title="Resumen de nómina"
        items={[
          { label: "Empleados", value: empleados.length, Icon: Users, hint: `${directos} directos · ${indirectos} indirectos` },
          { label: "Nómina mensual total", value: fmtMoney2(nominaTotal), Icon: DollarSign },
          { label: "Salario promedio", value: fmtMoney2(salarioPromedio), Icon: TrendingUp },
          { label: "Afecta el costeo", value: `${empleados.length} salario(s)`, Icon: Layers, hint: "ya incluidos en Costeos por unidad", tone: "dark" },
        ]}
      />
      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-1 flex items-center gap-2">
          <Users className="w-4 h-4" /> Alta de empleado
        </h3>
        <p className="text-[12px] text-zinc-500 mb-3">Al guardar, se crea automáticamente su salario como componente de costo en Costeos (mano de obra directa o indirecta).</p>
        <div className="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Nombre</span>
            <input value={form.nombre} onChange={(e) => set("nombre", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Puesto</span>
            <input value={form.puesto} onChange={(e) => set("puesto", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Tipo</span>
            <select value={form.tipo} onChange={(e) => set("tipo", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900">
              <option value="Directo">Directo (producción)</option>
              <option value="Indirecto">Indirecto (gestión)</option>
            </select>
          </label>
          <label className="flex flex-col gap-1.5">

      </div>

}

/* ============================================================
   FINANZAS / PRESUPUESTO — dashboard derivado (sin formulario propio):
   cruza producción real + precio calculado + cotizaciones de Ventas
   ============================================================ */
function FinanzasTab({ reporte, reportePrecio, cotizaciones, rangoDesde, rangoHasta }) {
  const ingresoProyectado = reporte.produccionRango * reportePrecio.precioConIVA;
  const costoProyectado = reporte.produccionRango * reporte.costoPorUnidad;
  const utilidadProyectada = ingresoProyectado - costoProyectado;
  const totalCotizado = cotizaciones.reduce((s, c) => s + c.total, 0);

  return (
    <div className="max-w-[1500px] mx-auto px-4 md:px-6 py-4 space-y-4">
      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-1 flex items-center gap-2">
          <TrendingUp className="w-4 h-4" /> Flujo de caja proyectado
        </h3>
        <p className="text-[12px] text-zinc-500">Calculado con la producción real registrada en el rango elegido en "Precio de venta y margen" ({fmtFecha(rangoDesde)} → {fmtFecha(rangoHasta)}).</p>
      </div>
      <div className="text-[10px] font-semibold tracking-widest uppercase text-zinc-400 mb-2 flex items-center gap-1.5">
        <TrendingUp className="w-3 h-3" /> Resumen financiero
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div className="bg-white rounded-2xl border border-zinc-200 p-4">
          <div className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500 mb-2">Ingreso proyectado</div>
          <div className="text-xl font-semibold tracking-tight mono">{fmtMoney2(ingresoProyectado)}</div>
        </div>
        <div className="bg-white rounded-2xl border border-zinc-200 p-4">
          <div className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500 mb-2">Costo proyectado</div>
          <div className="text-xl font-semibold tracking-tight mono">{fmtMoney2(costoProyectado)}</div>
        </div>
        <div className="bg-zinc-900 text-white rounded-2xl border border-zinc-900 p-4">
          <div className="text-[10px] font-semibold tracking-widest uppercase text-zinc-400 mb-2">Utilidad proyectada</div>
          <div className="text-xl font-semibold tracking-tight mono">{fmtMoney2(utilidadProyectada)}</div>
        </div>
        <div className="bg-white rounded-2xl border border-zinc-200 p-4">
          <div className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500 mb-2">Total cotizado (Ventas)</div>
          <div className="text-xl font-semibold tracking-tight mono">{fmtMoney2(totalCotizado)}</div>
          <div className="text-[11px] text-zinc-500 mt-1">{cotizaciones.length} cotizaciones guardadas</div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   LEGAL Y CONTRATOS — vigencia de contratos con proveedores,
   cruzado contra los proveedores realmente usados en Costeos
   ============================================================ */
function LegalTab({ contratos, setContratos, rows }) {
  const [form, setForm] = useState({ proveedor: "", descripcion: "", fechaFin: "" });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const proveedoresUsados = Array.from(new Set(rows.map((r) => r.proveedor).filter(Boolean)));
  const proveedoresConContrato = new Set(contratos.map((c) => c.proveedor));
  const sinContrato = proveedoresUsados.filter((p) => !proveedoresConContrato.has(p));

  const agregar = () => {
    if (!form.proveedor.trim() || !form.fechaFin) return;
    setContratos((prev) => [{ id: uid(), proveedor: form.proveedor.trim(), descripcion: form.descripcion.trim(), fechaInicio: new Date().toISOString(), fechaFin: form.fechaFin }, ...prev]);
    setForm({ proveedor: "", descripcion: "", fechaFin: "" });
  };
  const eliminar = (id) => setContratos((prev) => prev.filter((c) => c.id !== id));

  const ahoraLegal = new Date();
  const vencidos = contratos.filter((c) => new Date(c.fechaFin) < ahoraLegal).length;
  const porVencer = contratos.filter((c) => {
    const dias = (new Date(c.fechaFin) - ahoraLegal) / 86400000;
    return dias >= 0 && dias <= 30;
  }).length;
  const vigentes = contratos.length - vencidos - porVencer;

  return (
    <div className="max-w-[1500px] mx-auto px-4 md:px-6 py-4 space-y-4">
      <DashboardKpis
        title="Resumen legal"
        items={[
          { label: "Contratos totales", value: contratos.length, Icon: FileText },
          { label: "Vigentes", value: vigentes, Icon: Check },
          { label: "Por vencer (30 días)", value: porVencer, Icon: Clock, tone: porVencer > 0 ? "warn" : undefined },
          { label: "Proveedores sin contrato", value: sinContrato.length, Icon: TriangleAlert, tone: sinContrato.length > 0 ? "warn" : "dark" },
        ]}
      />
      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3 flex items-center gap-2">
          <FileText className="w-4 h-4" /> Nuevo contrato con proveedor
        </h3>
        <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Proveedor</span>
            <input value={form.proveedor} onChange={(e) => set("proveedor", e.target.value)} list="proveedores-legal" className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
            <datalist id="proveedores-legal">{proveedoresUsados.map((p) => <option key={p} value={p} />)}</datalist>
          </label>
          <label className="flex flex-col gap-1.5 md:col-span-2">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Descripción</span>
            <input value={form.descripcion} onChange={(e) => set("descripcion", e.target.value)} placeholder="Ej: Contrato de suministro anual" className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Vence el</span>
            <input type="date" value={form.fechaFin ? form.fechaFin.slice(0, 10) : ""} onChange={(e) => set("fechaFin", e.target.value ? new Date(e.target.value).toISOString() : "")} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
          </label>
        </div>
        <button onClick={agregar} disabled={!form.proveedor.trim() || !form.fechaFin} className="mt-3 px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition flex items-center gap-1.5 disabled:opacity-40">
          <Plus className="w-4 h-4" /> Guardar contrato
        </button>
      </div>

      {sinContrato.length > 0 && (
        <div className="rounded-xl border border-amber-200 bg-amber-50 p-3 text-[12px] text-amber-700 flex items-center gap-2">
          <TriangleAlert className="w-4 h-4 shrink-0" /> Proveedores usados en Costeos sin contrato registrado: {sinContrato.join(", ")}
        </div>
      )}

      <div className="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-200 bg-zinc-50/50">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase">Contratos ({contratos.length})</h3>
        </div>
        {contratos.length === 0 && <div className="p-6 text-center text-[13px] text-zinc-500">Sin contratos registrados.</div>}
        {contratos.map((c) => {
          const vencido = new Date(c.fechaFin) < new Date();
          const proximo = !vencido && (new Date(c.fechaFin) - new Date()) / 86400000 <= 30;
          return (
            <div key={c.id} className="px-4 py-2.5 border-b border-zinc-100 flex items-center justify-between text-[12px]">
              <div>
                <div className="font-medium">{c.proveedor} <span className="text-zinc-400">· {c.descripcion}</span></div>
                <div className="text-[11px] text-zinc-500">Vence {fmtFecha(c.fechaFin)}</div>
              </div>
              <div className="flex items-center gap-2">
                <span className={`text-[10px] px-2 py-0.5 rounded-full border ${vencido ? "bg-red-50 text-red-700 border-red-200" : proximo ? "bg-amber-50 text-amber-700 border-amber-200" : "bg-emerald-50 text-emerald-700 border-emerald-200"}`}>
                  {vencido ? "Vencido" : proximo ? "Vence pronto" : "Vigente"}
                </span>
                <button onClick={() => eliminar(c.id)} className="w-7 h-7 rounded-lg border border-zinc-200 bg-white flex items-center justify-center hover:bg-red-600 hover:text-white hover:border-red-600 transition">
                  <Trash2 className="w-3 h-3" />
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   M03 · CONTABILIDAD, IMPUESTOS Y FISCAL — primer módulo del mapa
   organizacional con datos 100% reales e interconectados (no
   placeholder). Sus 8 submódulos comparten:
   - CxC derivadas en vivo de Ventas (cotizaciones)
   - CxP derivadas en vivo de Compras/Costeos (componentes recurrentes
     con proveedor) y de RRHH (nómina de empleados dados de alta)
   - Un estado de seguimiento (cxEstados) que cualquier submódulo
     puede leer o modificar → efecto cascada inmediato en los demás
   - Bandeja de entrada propia por submódulo (pendientes que requieren
     acción) y su propio dashboard de KPIs
   ============================================================ */
const HOY_MS = () => Date.now();
const DIA_MS = 86400000;

function useContabilidadDerivada({ facturasVenta, notasCredito, rows, empleados, cxEstados }) {
  return useMemo(() => {
    // CxC ahora nace de Facturación (Ventas): sólo facturas activas y no
    // canceladas, netas de notas de crédito activas aplicadas sobre cada
    // una — efecto cascada real Factura → Nota de crédito → CxC.
    const cxc = facturasVenta
      .filter((f) => f.estado === "activo" && f.estadoComercial !== "Cancelada")
      .map((f) => {
        const key = `cxc-${f.id}`;
        const notaAplicada = notasCredito
          .filter((n) => n.facturaId === f.id && n.estado === "activo")
          .reduce((s, n) => s + n.monto, 0);
        const vencimiento = new Date(new Date(f.fechaCreacion).getTime() + 30 * DIA_MS);
        const seg = cxEstados[key] || {};
        const estadoDerivado = f.estadoComercial === "Cobrada" ? "liquidado" : (seg.estado || "pendiente");
        return {
          key, origen: "Ventas", refId: f.id,
          concepto: `Factura — ${f.cliente}${f.productoNombre ? " · " + f.productoNombre : ""}`,
          contraparte: f.cliente, monto: f.total - notaAplicada, fecha: f.fechaCreacion,
          vencimiento: vencimiento.toISOString(),
          estado: estadoDerivado, fechaResolucion: seg.fecha || null,
          vencida: estadoDerivado !== "liquidado" && vencimiento.getTime() < HOY_MS(),
        };
      });

    const cxpComponentes = rows
      .filter((r) => r.incluido && r.proveedor && r.proveedor.trim() && r.periodo !== "Por unidad")
      .map((r) => {
        const key = `cxp-${r.id}`;
        const vencimiento = new Date(new Date(r.fechaInicio).getTime() + 30 * DIA_MS);
        const seg = cxEstados[key] || {};
        return {
          key, origen: "Compras/Costeos", refId: r.id,
          concepto: `${r.concepto} (${r.periodo})`,
          contraparte: r.proveedor, monto: Number(r.costoAdquisicion) || 0, fecha: r.fechaInicio,
          vencimiento: vencimiento.toISOString(),
          estado: seg.estado || "pendiente", fechaResolucion: seg.fecha || null,
          vencida: seg.estado !== "liquidado" && vencimiento.getTime() < HOY_MS(),
        };
      });

    const cxpNomina = empleados.map((e) => {
      const key = `nomina-${e.id}`;
      const seg = cxEstados[key] || {};
      const fechaAlta = e.fechaAlta || e.fecha || new Date().toISOString();
      const vencimiento = new Date(new Date(fechaAlta).getTime() + 30 * DIA_MS);
      return {
        key, origen: "RRHH", refId: e.id,
        concepto: `Nómina — ${e.nombre} (${e.puesto || e.tipo || "Empleado"})`,
        contraparte: e.nombre, monto: Number(e.salarioMensual) || 0, fecha: fechaAlta,
        vencimiento: vencimiento.toISOString(),
        estado: seg.estado || "pendiente", fechaResolucion: seg.fecha || null,
        vencida: seg.estado !== "liquidado" && vencimiento.getTime() < HOY_MS(),
      };
    });

    const cxp = [...cxpComponentes, ...cxpNomina];
    const sum = (arr, pred) => arr.filter(pred || (() => true)).reduce((s, x) => s + x.monto, 0);
    return {
      cxc, cxp,
      cxcPendiente: sum(cxc, (x) => x.estado !== "liquidado"),
      cxcVencida: sum(cxc, (x) => x.vencida),
      cxcCobrado: sum(cxc, (x) => x.estado === "liquidado"),
      cxpPendiente: sum(cxp, (x) => x.estado !== "liquidado"),
      cxpVencida: sum(cxp, (x) => x.vencida),
      cxpPagado: sum(cxp, (x) => x.estado === "liquidado"),
    };
  }, [facturasVenta, notasCredito, rows, empleados, cxEstados]);
}

function BandejaEntrada({ items, tono = "amber", accionLabel, onAccion, vacio }) {
  if (!items.length) return <div className="text-[12px] text-zinc-500 py-3 text-center">{vacio || "Bandeja vacía — nada pendiente."}</div>;
  return (
    <div className="space-y-2">
      {items.map((it) => (
        <div key={it.key || it.id} className={`flex items-center justify-between gap-3 rounded-xl border px-3 py-2.5 ${it.vencida ? "bg-red-50 border-red-200" : `bg-${tono}-50 border-${tono}-200`}`}>
          <div className="min-w-0">
            <div className="text-[12.5px] font-medium truncate">{it.concepto}</div>
            <div className="text-[11px] text-zinc-500">{it.contraparte} · {fmtMoney2(it.monto)}{it.vencimiento ? ` · vence ${fmtFecha(it.vencimiento)}` : ""} {it.origen && <span className="ml-1 px-1.5 py-0.5 rounded-full bg-white border border-zinc-200 text-[10px]">{it.origen}</span>}</div>
          </div>
          {onAccion && (
            <button onClick={() => onAccion(it)} className="shrink-0 px-3 py-1.5 rounded-lg bg-zinc-900 text-white text-[11px] font-medium hover:bg-black transition">
              {accionLabel || "Resolver"}
            </button>
          )}
        </div>
      ))}
    </div>
  );
}

function ContabilidadGeneralSub({ derivado, asientos, setAsientos, hallazgosAbiertosAlta }) {
  const [form, setForm] = useState({ concepto: "", tipo: "cargo", monto: 0, cuenta: "" });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const agregar = () => {
    if (!form.concepto.trim() || !form.monto) return;
    setAsientos((prev) => [{ id: uid(), fecha: new Date().toISOString(), ...form, concepto: form.concepto.trim(), monto: Number(form.monto) }, ...prev]);
    setForm({ concepto: "", tipo: "cargo", monto: 0, cuenta: "" });
  };
  const eliminar = (id) => setAsientos((prev) => prev.filter((a) => a.id !== id));
  const activo = derivado.cxcPendiente;
  const pasivo = derivado.cxpPendiente;
  const patrimonio = activo - pasivo;
  const pendientesBandeja = [
    ...derivado.cxc.filter((x) => x.estado !== "liquidado").slice(0, 3).map((x) => ({ ...x, tag: "CxC sin cobrar" })),
    ...derivado.cxp.filter((x) => x.estado !== "liquidado").slice(0, 3).map((x) => ({ ...x, tag: "CxP sin pagar" })),
  ];

  return (
    <div className="space-y-4">
      <DashboardKpis title="Balance general simplificado (en vivo)" items={[
        { label: "Activo (CxC pendiente)", value: fmtMoney2(activo), Icon: TrendingUp },
        { label: "Pasivo (CxP + nómina pendiente)", value: fmtMoney2(pasivo), Icon: TriangleAlert, tone: pasivo > activo ? "warn" : undefined },
        { label: "Patrimonio implícito", value: fmtMoney2(patrimonio), Icon: DollarSign, tone: "dark" },
        { label: "Hallazgos de auditoría abiertos (alta)", value: hallazgosAbiertosAlta, Icon: TriangleAlert, tone: hallazgosAbiertosAlta > 0 ? "warn" : undefined },
      ]} />

      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Bandeja de entrada — pendientes de otros submódulos</h3>
        <BandejaEntrada items={pendientesBandeja} vacio="Sin pendientes de CxC/CxP." />
        <div className="mt-2 text-[11px] text-zinc-500">Se cobra/paga desde Cuentas por Cobrar / Cuentas por Pagar — aquí solo se refleja el efecto en el balance.</div>
      </div>

      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Diario general — asiento manual</h3>
        <div className="grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
          <label className="flex flex-col gap-1.5 md:col-span-2">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Concepto</span>
            <input value={form.concepto} onChange={(e) => set("concepto", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Cuenta contable</span>
            <input value={form.cuenta} onChange={(e) => set("cuenta", e.target.value)} placeholder="Ej. Bancos" className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Tipo</span>
            <select value={form.tipo} onChange={(e) => set("tipo", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900">
              <option value="cargo">Cargo</option>
              <option value="abono">Abono</option>
            </select>
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Monto</span>
            <input type="number" value={form.monto} onChange={(e) => set("monto", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
          </label>
        </div>
        <button onClick={agregar} className="mt-3 px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition flex items-center gap-1.5">
          <Plus className="w-4 h-4" /> Registrar asiento
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-200 bg-zinc-50/50">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase">Asientos manuales ({asientos.length})</h3>
        </div>
        {asientos.length === 0 && <div className="p-6 text-center text-[13px] text-zinc-500">Sin asientos manuales todavía.</div>}
        {asientos.map((a) => (
          <div key={a.id} className="px-4 py-2.5 border-b border-zinc-100 flex items-center justify-between text-[12px]">
            <div>
              <div className="font-medium">{a.concepto} {a.cuenta && <span className="text-[10px] px-2 py-0.5 rounded-full bg-zinc-100 border border-zinc-200 ml-1">{a.cuenta}</span>}</div>

              <span className="mono font-semibold">{fmtMoney2(a.monto)}</span>

            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function CuentasPorPagarSub({ derivado, resolver }) {
  const pendientes = derivado.cxp.filter((x) => x.estado !== "liquidado").sort((a, b) => new Date(a.vencimiento) - new Date(b.vencimiento));
  const liquidadas = derivado.cxp.filter((x) => x.estado === "liquidado");
  return (
    <div className="space-y-4">
      <DashboardKpis title="Cuentas por pagar" items={[
        { label: "Total por pagar", value: fmtMoney2(derivado.cxpPendiente), Icon: TrendingUp, tone: "dark" },
        { label: "Vencidas", value: fmtMoney2(derivado.cxpVencida), Icon: TriangleAlert, tone: derivado.cxpVencida > 0 ? "warn" : undefined },
        { label: "Pagado histórico", value: fmtMoney2(derivado.cxpPagado), Icon: DollarSign },
        { label: "Facturas pendientes", value: pendientes.length, Icon: FileText },
      ]} />
      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Bandeja de entrada — por pagar (generadas desde Compras/Costeos y RRHH)</h3>
        <BandejaEntrada items={pendientes} accionLabel="Marcar pagada" onAccion={(it) => resolver(it.key, "liquidado")} vacio="No hay cuentas por pagar pendientes." />
      </div>
      {liquidadas.length > 0 && (
        <div className="bg-white rounded-2xl border border-zinc-200 p-4">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Pagadas ({liquidadas.length})</h3>

          </div>
        </div>
      )}
    </div>
  );
}

function CierreContableSub({ derivado, cierres, setCierres, hallazgosAbiertosAlta }) {
  const periodoActual = new Date().toISOString().slice(0, 7);
  const yaCerrado = cierres.some((c) => c.periodo === periodoActual);
  const bloqueos = [
    ...(derivado.cxcVencida > 0 ? [{ texto: `${fmtMoney2(derivado.cxcVencida)} en cuentas por cobrar vencidas sin resolver` }] : []),
    ...(derivado.cxpVencida > 0 ? [{ texto: `${fmtMoney2(derivado.cxpVencida)} en cuentas por pagar vencidas sin resolver` }] : []),
    ...(hallazgosAbiertosAlta > 0 ? [{ texto: `${hallazgosAbiertosAlta} hallazgo(s) de auditoría externa de severidad alta sin atender` }] : []),
  ];
  const puedeCerrar = bloqueos.length === 0 && !yaCerrado;
  const cerrar = () => {
    if (!puedeCerrar) return;
    setCierres((prev) => [{ periodo: periodoActual, fecha: new Date().toISOString(), cxcCobrado: derivado.cxcCobrado, cxpPagado: derivado.cxpPagado }, ...prev]);
  };
  return (
    <div className="space-y-4">
      <DashboardKpis title="Cierre contable" items={[
        { label: "Periodo actual", value: periodoActual, Icon: Clock },
        { label: "Estado", value: yaCerrado ? "Cerrado" : "Abierto", Icon: yaCerrado ? Check : TriangleAlert, tone: yaCerrado ? "dark" : (bloqueos.length ? "warn" : undefined) },
        { label: "Bloqueos activos", value: bloqueos.length, Icon: TriangleAlert, tone: bloqueos.length > 0 ? "warn" : undefined },
        { label: "Cierres históricos", value: cierres.length, Icon: FileText },
      ]} />
      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Checklist de cierre — bandeja de bloqueos (cascada desde CxC, CxP y Auditoría)</h3>
        {bloqueos.length === 0 ? (
          <div className="text-[12px] text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl p-3">Sin bloqueos. El periodo puede cerrarse.</div>
        ) : (
          <div className="space-y-2">
            {bloqueos.map((b, i) => (
              <div key={i} className="text-[12px] text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">{b.texto}</div>
            ))}
          </div>
        )}
        <button onClick={cerrar} disabled={!puedeCerrar} className="mt-3 px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition disabled:opacity-30">
          {yaCerrado ? "Periodo ya cerrado" : "Cerrar periodo " + periodoActual}
        </button>
      </div>
      {cierres.length > 0 && (
        <div className="bg-white rounded-2xl border border-zinc-200 p-4">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Historial de cierres</h3>
          <div className="space-y-1.5">
            {cierres.map((c) => (
              <div key={c.periodo} className="flex items-center justify-between text-[12px] border-b border-zinc-100 pb-1.5">
                <span className="font-medium">{c.periodo}</span>
                <span className="text-zinc-500">Cobrado {fmtMoney2(c.cxcCobrado)} · Pagado {fmtMoney2(c.cxpPagado)}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function ImpuestosSub({ derivado, iva, declaraciones, setDeclaraciones }) {
  const ivaTrasladado = derivado.cxcCobrado * ((Number(iva) || 0) / (100 + (Number(iva) || 0)));
  const ivaAcreditable = derivado.cxpPagado * ((Number(iva) || 0) / (100 + (Number(iva) || 0)));
  const ivaAPagar = Math.max(0, ivaTrasladado - ivaAcreditable);
  const utilidadGravable = Math.max(0, derivado.cxcCobrado - derivado.cxpPagado);
  const isrEstimado = utilidadGravable * 0.3;
  const [form, setForm] = useState({ tipo: "IVA mensual", monto: 0, fechaLimite: "" });

/* ============================================================
   PERSISTENCIA EN LOCALSTORAGE
   Guarda automáticamente todo lo capturado (componentes, producción,
   productos, márgenes, rangos de reporte, etc.) para que no se pierda
   nada al cerrar la pestaña, refrescar o volver a abrir el navegador.
   ============================================================ */
const STORAGE_KEY = "constructorPrecioV4.estado";

let __estadoPersistidoCache;
let __estadoPersistidoCargado = false;
function obtenerEstadoPersistido() {
  if (!__estadoPersistidoCargado) {
    __estadoPersistidoCargado = true;
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      __estadoPersistidoCache = raw ? JSON.parse(raw) : null;
    } catch (e) {
      console.warn("No se pudo leer el estado guardado en localStorage:", e);
      __estadoPersistidoCache = null;
    }
  }
  return __estadoPersistidoCache;
}

  const [modal, setModal] = useState(null); // null | {mode:'new'} | {mode:'edit', row} | {mode:'version', row}
  const [confirmClear, setConfirmClear] = useState(false);
  // 'costeos' | 'precioventa' | 'controlprod' | 'rendimiento' | 'preciosinsumos' | 'historialcostos' | 'ficha' | 'bom'
  const [vista, setVista] = useState(() => persistido?.vista ?? "costeos");
  const MODULES = [
    { id: "contabilidad", label: "Contabilidad", Icon: Calculator, sub: [
      { v: "costeos", label: "Costeos", Icon: Layers },
      { v: "precioventa", label: "Precio de venta y margen", Icon: DollarSign },
    ]},
    { id: "operaciones", label: "Operaciones / Producción", Icon: Boxes, sub: [
      { v: "controlprod", label: "Control de producción", Icon: Boxes },
      { v: "rendimiento", label: "Rendimiento e insumos por unidad", Icon: Repeat },
    ]},
    { id: "compras", label: "Compras / Abastecimiento", Icon: Package, sub: [
      { v: "preciosinsumos", label: "Precios de insumos y proveedores", Icon: DollarSign },
      { v: "historialcostos", label: "Historial de costos de adquisición", Icon: Clock },
    ]},
    { id: "catalogo", label: "Catálogo de Productos y Servicios", Icon: Package, sub: [
      { v: "ficha", label: "Ficha técnica del producto", Icon: Info },
      { v: "bom", label: "Estructura de materiales / BOM", Icon: Layers },
    ]},
    { id: "ventas", label: "Ventas y Cotizaciones", Icon: DollarSign, sub: [
      { v: "ventas-clientes", label: "Clientes", Icon: UserPlus },
      { v: "ventas-cotizaciones", label: "Cotizaciones", Icon: DollarSign },
      { v: "ventas-pedidos", label: "Pedidos", Icon: Boxes },
      { v: "ventas-facturas", label: "Facturación", Icon: FileText },
      { v: "ventas-notascredito", label: "Notas de crédito", Icon: TriangleAlert },
      { v: "ventas-comisiones", label: "Comisiones y cuotas", Icon: BadgePercent },
    ]},
    { id: "rrhh", label: "RRHH y Nómina", Icon: Users, sub: [
      { v: "empleados", label: "Empleados y mano de obra", Icon: Users },
    ]},
    { id: "finanzas", label: "Finanzas / Presupuesto", Icon: TrendingUp, sub: [
      { v: "flujocaja", label: "Flujo de caja por producto", Icon: TrendingUp },
    ]},
    { id: "legal", label: "Legal y Contratos", Icon: FileText, sub: [
      { v: "contratos", label: "Contratos con proveedores", Icon: FileText },
    ]},
    ...ORG_MODULES.map((m, i) => ({
      id: `org-${i}`,
      label: m.cat,
      Icon: Info,
      sub: m.subs.map((s, j) => ({ v: `org-${i}-${j}`, label: s, Icon: Info })),
    })),
  ];
  const moduloActivo = MODULES.find((m) => m.sub.some((s) => s.v === vista)) || MODULES[0];
  const submoduloActivo = moduloActivo.sub.find((s) => s.v === vista) || moduloActivo.sub[0];
  const [menuOpen, setMenuOpen] = useState(false);
  const [menuModule, setMenuModule] = useState(null); // null = lista de módulos; id = submódulos de ese módulo
  const [notifOpen, setNotifOpen] = useState(false); // campana global — agrega pendientes de todos los módulos reales
  const [preferenciasVersion, setPreferenciasVersion] = useState(() => persistido?.preferenciasVersion ?? {}); // {groupId: 'reciente'|'vieja'}
  const [produccion, setProduccion] = useState(() => persistido?.produccion ?? SEED_PRODUCCION); // eventos reales de producción con fecha exacta
  const [productos, setProductos] = useState(() => persistido?.productos ?? SEED_PRODUCTOS); // productos/servicios y qué componentes usan
  const now = new Date();
  const hace30 = new Date(now.getTime() - 30 * 86400000);
  const [rangoDesde, setRangoDesde] = useState(() => persistido?.rangoDesde ?? hace30.toISOString());
  const [rangoHasta, setRangoHasta] = useState(() => persistido?.rangoHasta ?? now.toISOString());
  const [cotizaciones, setCotizaciones] = useState(() => persistido?.cotizaciones ?? SEED_COTIZACIONES); // Ventas
  const [clientesVenta, setClientesVenta] = useState(() => persistido?.clientesVenta ?? SEED_CLIENTES); // Ventas · Clientes
  const [pedidosVenta, setPedidosVenta] = useState(() => persistido?.pedidosVenta ?? SEED_PEDIDOS); // Ventas · Pedidos (cascada desde Cotizaciones aceptadas)
  const [facturasVenta, setFacturasVenta] = useState(() => persistido?.facturasVenta ?? SEED_FACTURAS); // Ventas · Facturación (cascada desde Pedidos entregados; alimenta CxC de Contabilidad)
  const [notasCredito, setNotasCredito] = useState(() => persistido?.notasCredito ?? SEED_NOTAS_CREDITO); // Ventas · Notas de crédito (cascada inversa sobre Facturas)
  const [vendedores, setVendedores] = useState(() => persistido?.vendedores ?? SEED_VENDEDORES); // Ventas · Comisiones y cuotas
  const [empleados, setEmpleados] = useState(() => persistido?.empleados ?? SEED_EMPLEADOS); // RRHH
  const [contratos, setContratos] = useState(() => persistido?.contratos ?? SEED_CONTRATOS); // Legal
  const [orgData, setOrgData] = useState(() => persistido?.orgData ?? {}); // datos genéricos de los submódulos placeholder restantes
  // M03 · Contabilidad, Impuestos y Fiscal — estado real e interconectado
  const [cxEstados, setCxEstados] = useState(() => persistido?.cxEstados ?? {}); // seguimiento de CxC/CxP derivadas (cobrado/pagado)
  const [asientosContables, setAsientosContables] = useState(() => persistido?.asientosContables ?? SEED_ASIENTOS); // Contabilidad General
  const [declaracionesFiscales, setDeclaracionesFiscales] = useState(() => persistido?.declaracionesFiscales ?? SEED_DECLARACIONES); // Impuestos
  const [operacionesIntercompania, setOperacionesIntercompania] = useState(() => persistido?.operacionesIntercompania ?? SEED_OPERACIONES); // Precios de Transferencia
  const [hallazgosAuditoria, setHallazgosAuditoria] = useState(() => persistido?.hallazgosAuditoria ?? SEED_HALLAZGOS); // Auditoría Externa
  const [cierresContables, setCierresContables] = useState(() => persistido?.cierresContables ?? SEED_CIERRES); // Cierre Contable
  const PER_PAGE = 60;

  // Guarda automáticamente TODO en localStorage en cada cambio, para que nada
  // se pierda al cerrar la pestaña, recargar la página o apagar el dispositivo.
  useEffect(() => {
    try {
      const estado = {
        components, margen, iva, utilidadFija, produccionGlobal,
        preferenciasVersion, produccion, productos, rangoDesde, rangoHasta, vista,
        cotizaciones, clientesVenta, pedidosVenta, facturasVenta, notasCredito, vendedores, empleados, contratos, orgData,
        cxEstados, asientosContables, declaracionesFiscales, operacionesIntercompania, hallazgosAuditoria, cierresContables,
      };
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
    } catch (e) {
      console.warn("No se pudo guardar el estado en localStorage:", e);
    }
  }, [components, margen, iva, utilidadFija, produccionGlobal, preferenciasVersion, produccion, productos, rangoDesde, rangoHasta, vista, cotizaciones, clientesVenta, pedidosVenta, facturasVenta, notasCredito, vendedores, empleados, contratos, orgData, cxEstados, asientosContables, declaracionesFiscales, operacionesIntercompania, hallazgosAuditoria, cierresContables]);

  const togglePreferencia = (groupId) =>
    setPreferenciasVersion((prev) => ({ ...prev, [groupId]: (prev[groupId] || "reciente") === "reciente" ? "vieja" : "reciente" }));

  useEffect(() => setPagina(1), [q, catFiltro, tipoFiltro, periodoFiltro, incluidoFiltro, sortCol, sortDir]);

  const rows = useMemo(() => {
    return components.map((c) => ({ ...c, costoUnidad: computeCostoUnidad(c) }));
  }, [components]);

  const filtered = useMemo(() => {
    let r = rows;
    if (catFiltro !== "Todas") r = r.filter((c) => c.categoria === catFiltro);
    if (tipoFiltro !== "Todos") r = r.filter((c) => c.tipo === tipoFiltro);
    if (periodoFiltro !== "Todos") r = r.filter((c) => c.periodo === periodoFiltro);
    if (incluidoFiltro === "Incluidos") r = r.filter((c) => c.incluido);
    if (incluidoFiltro === "Excluidos") r = r.filter((c) => !c.incluido);
    if (q.trim()) {
      const t = q.toLowerCase();
      r = r.filter(
        (c) =>
          (c.concepto || "").toLowerCase().includes(t) ||
          c.subcategoria.toLowerCase().includes(t) ||
          c.categoria.toLowerCase().includes(t)
      );
    }
    // Ordenamiento
    r = [...r].sort((a, b) => {
      let va, vb;
      if (sortCol === "fecha")     { va = new Date(a.fechaInicio).getTime(); vb = new Date(b.fechaInicio).getTime(); }
      else if (sortCol === "costo"){ va = a.costoUnidad; vb = b.costoUnidad; }
      else if (sortCol === "adq")  { va = a.costoAdquisicion; vb = b.costoAdquisicion; }
      else if (sortCol === "pct")  { va = a.costoUnidad; vb = b.costoUnidad; } // mismo criterio que costo
      else if (sortCol === "concepto") { va = (a.concepto || a.subcategoria).toLowerCase(); vb = (b.concepto || b.subcategoria).toLowerCase(); }
      else if (sortCol === "categoria") { va = a.categoria.toLowerCase(); vb = b.categoria.toLowerCase(); }
      else if (sortCol === "periodo") { va = a.periodo.toLowerCase(); vb = b.periodo.toLowerCase(); }
      else return 0;
      if (va < vb) return sortDir === "asc" ? -1 : 1;
      if (va > vb) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return r;
  }, [rows, q, catFiltro, tipoFiltro, periodoFiltro, incluidoFiltro, sortCol, sortDir]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  const pageRows = filtered.slice((pagina - 1) * PER_PAGE, pagina * PER_PAGE);

  // Cuántas versiones tiene cada concepto (para mostrar el selector solo cuando aplica)
  const versionesPorGrupo = useMemo(() => {
    const m = {};
    components.forEach((c) => { m[c.groupId] = (m[c.groupId] || 0) + 1; });
    return m;
  }, [components]);

  const stats = useMemo(() => {
    const inclAll = rows.filter((c) => c.incluido);
    const incl = pickRepresentatives(inclAll, preferenciasVersion, null); // 1 versión por concepto, según preferencia
    const costoTotal = incl.reduce((s, c) => s + c.costoUnidad, 0);
    const directo = incl.filter((c) => c.tipo === "Directo").reduce((s, c) => s + c.costoUnidad, 0);
    const indirecto = incl.filter((c) => c.tipo === "Indirecto").reduce((s, c) => s + c.costoUnidad, 0);
    const fijo = incl.filter((c) => c.tipo === "Fijo").reduce((s, c) => s + c.costoUnidad, 0);
    const variable = incl.filter((c) => c.tipo === "Variable").reduce((s, c) => s + c.costoUnidad, 0);

    const porCategoria = {};
    CAT_NAMES.forEach((n) => (porCategoria[n] = { total: 0, count: 0 }));
    incl.forEach((c) => {
      porCategoria[c.categoria].total += c.costoUnidad;
      porCategoria[c.categoria].count += 1;
    });

    const base = costoTotal + (Number(utilidadFija) || 0);
    const margenMonto = base * ((Number(margen) || 0) / 100);
    const precioSinIVA = base + margenMonto;
    const ivaMonto = precioSinIVA * ((Number(iva) || 0) / 100);
    const precioConIVA = precioSinIVA + ivaMonto;

    return {
      costoTotal, directo, indirecto, fijo, variable, porCategoria,
      base, margenMonto, precioSinIVA, ivaMonto, precioConIVA,
      porcDirecto: costoTotal > 0 ? (directo / costoTotal) * 100 : 0,
      porcIndirecto: costoTotal > 0 ? (indirecto / costoTotal) * 100 : 0,
      totalIncluidos: incl.length,
    };
  }, [rows, margen, iva, utilidadFija, preferenciasVersion]);

  // Reporte exacto por rango de fechas: usa la producción real registrada, no un promedio.
  const reporte = useMemo(
    () => computeReportePorRango({ components, preferencias: preferenciasVersion, produccion, desdeISO: rangoDesde, hastaISO: rangoHasta }),
    [components, preferenciasVersion, produccion, rangoDesde, rangoHasta]
  );
  const reportePrecio = useMemo(() => {
    const base = reporte.costoPorUnidad + (Number(utilidadFija) || 0);
    const margenMonto = base * ((Number(margen) || 0) / 100);
    const precioSinIVA = base + margenMonto;
    const ivaMonto = precioSinIVA * ((Number(iva) || 0) / 100);
    return { margenMonto, precioSinIVA, ivaMonto, precioConIVA: precioSinIVA + ivaMonto };
  }, [reporte, margen, iva, utilidadFija]);

  // Campana global (esquina superior derecha) — agrega en un solo lugar los
  // pendientes que requieren acción en cualquier módulo real interconectado.
  const notificacionesGlobales = useMemo(() => {
    const items = [];
    cotizaciones.forEach((c) => {
      if (c.estado === "activo" && c.estadoComercial === "Enviada")
        items.push({ id: c.id, texto: `Cotización de ${c.cliente} esperando respuesta`, monto: c.total, fecha: c.fecha, ir: "ventas-cotizaciones" });
    });
    pedidosVenta.forEach((p) => {
      if (p.estado === "activo" && p.estadoComercial !== "Entregado")
        items.push({ id: p.id, texto: `Pedido de ${p.cliente} por surtir/entregar`, monto: p.total, fecha: p.fechaCreacion, ir: "ventas-pedidos" });
    });
    facturasVenta.forEach((f) => {
      if (f.estado === "activo" && f.estadoComercial === "Emitida")
        items.push({ id: f.id, texto: `Factura de ${f.cliente} pendiente de cobro`, monto: f.total, fecha: f.fechaCreacion, ir: "ventas-facturas" });
    });
    return items.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  }, [cotizaciones, pedidosVenta, facturasVenta]);

  const patch = (id, field, value) =>
    setComponents((prev) => prev.map((c) => (c.id === id ? { ...c, [field]: value } : c)));
  const remove = (id) => setComponents((prev) => prev.filter((c) => c.id !== id));
  const duplicate = (row) => {
    const newId = uid();
    setComponents((prev) => [{ ...row, id: newId, groupId: newId, concepto: row.concepto + " (copia)" }, ...prev]);
  };
  // Registra una nueva versión del MISMO concepto (mismo groupId), con fecha de registro de hoy,
  // para poder elegir después si el reporte usa el costo viejo o el nuevo.
  const nuevaVersion = (row) =>
    setModal({ mode: "version", row: { ...row, id: uid(), fechaInicio: new Date().toISOString() } });

  const saveModal = (draft) => {
    setComponents((prev) => {
      const exists = prev.some((c) => c.id === draft.id);
      return exists ? prev.map((c) => (c.id === draft.id ? draft : c)) : [draft, ...prev];
    });
    setModal(null);
  };

  return (
    <div className="min-h-screen bg-[#f8f8f6] text-zinc-900 font-[Inter,system-ui,sans-serif] selection:bg-zinc-900 selection:text-white">
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap'); *{font-family: Inter, system-ui, sans-serif} .mono{font-family: 'JetBrains Mono', monospace}`}</style>

      {/* HEADER */}
      <div className="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-zinc-200">
        <div className="max-w-[1500px] mx-auto px-4 md:px-6 py-4 flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <button
              onClick={() => { setMenuOpen(true); setMenuModule(null); }}
              className="w-9 h-9 rounded-xl border border-zinc-200 bg-white flex items-center justify-center hover:bg-zinc-50 transition shrink-0"
              title="Abrir módulos"
            >
              <Menu className="w-4.5 h-4.5" />
            </button>
            <div className="w-9 h-9 rounded-xl bg-zinc-900 text-white flex items-center justify-center">
              <Calculator className="w-5 h-5" />
            </div>
            <div>
              <h1 className="text-[15px] font-semibold leading-none tracking-tight">Constructor de Precio por Producto</h1>
              <p className="text-[11px] text-zinc-500 mt-1 tracking-wide uppercase">{moduloActivo.label} · {submoduloActivo.label}</p>
            </div>
            <div className="hidden md:flex items-center gap-2 ml-4 pl-4 border-l border-zinc-200">
              <div className="text-[11px] px-2.5 py-1 rounded-full bg-zinc-900 text-white font-medium">{components.length} componentes</div>
              <div className="text-[11px] text-zinc-500">{stats.totalIncluidos} incluidos</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {vista === "costeos" && (
            <>
            <button onClick={() => setConfirmClear(true)} className="text-[12px] font-medium px-3 py-1.5 rounded-lg border border-zinc-200 bg-white hover:bg-zinc-50 transition">
              Limpiar todo
            </button>
            <button
              onClick={() => setModal({ mode: "new" })}
              className="px-4 py-2 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition flex items-center gap-1.5"
            >
              <Plus className="w-4 h-4" /> Agregar componente
            </button>
            </>
            )}
            <div className="relative">
              <button
                onClick={() => setNotifOpen((v) => !v)}
                className="relative w-9 h-9 rounded-xl border border-zinc-200 bg-white flex items-center justify-center hover:bg-zinc-50 transition"
                title="Bandeja de entrada global — pendientes de todos los módulos"
              >
                <Bell className="w-4 h-4" />
                {notificacionesGlobales.length > 0 && (
                  <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[10px] font-semibold flex items-center justify-center">
                    {notificacionesGlobales.length}
                  </span>
                )}
              </button>
              {notifOpen && (
                <div className="absolute right-0 top-11 z-40 w-80 bg-white rounded-2xl border border-zinc-200 shadow-2xl p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[11px] font-semibold tracking-widest uppercase text-zinc-500">Bandeja de entrada global</span>
                    <button onClick={() => setNotifOpen(false)} className="w-5 h-5 rounded flex items-center justify-center hover:bg-zinc-100"><X className="w-3 h-3" /></button>
                  </div>
                  <div className="space-y-1.5 max-h-80 overflow-auto pr-1">
                    {notificacionesGlobales.length === 0 && (
                      <div className="text-[12px] text-zinc-500 text-center py-4">Sin pendientes en ningún módulo.</div>
                    )}
                    {notificacionesGlobales.map((n) => (
                      <button
                        key={n.id}
                        onClick={() => { setVista(n.ir); setNotifOpen(false); }}
                        className="w-full text-left rounded-xl border border-zinc-200 hover:border-zinc-900 px-3 py-2 transition"
                      >
                        <div className="text-[12px] font-medium">{n.texto}</div>
                        <div className="text-[11px] text-zinc-500 mt-0.5">{fmtMoney2(n.monto)} · {fmtFecha(n.fecha)}</div>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* STATS */}
        {vista === "costeos" && (
        <div className="max-w-[1500px] mx-auto px-4 md:px-6 pb-4">
          <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
            <div className="bg-white rounded-2xl border border-zinc-200 p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Componentes</span>
                <Layers className="w-3.5 h-3.5 text-zinc-400" />
              </div>
              <div className="flex items-baseline gap-2">
                <span className="text-2xl font-semibold tracking-tight mono">{components.length}</span>
                <span className="text-sm text-zinc-500">/ 1000</span>
              </div>
              <div className="mt-3 h-1.5 bg-zinc-100 rounded-full overflow-hidden">
                <div className="h-full bg-zinc-900 rounded-full transition-all" style={{ width: `${Math.min(100, (components.length / 1000) * 100)}%` }} />
              </div>
            </div>
            <div className="bg-white rounded-2xl border border-zinc-200 p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Costo por unidad</span>
                <Package className="w-3.5 h-3.5 text-zinc-400" />
              </div>
              <div className="text-2xl font-semibold tracking-tight mono">{fmtMoney(stats.costoTotal)}</div>
              <div className="mt-2 flex items-center gap-2 text-[11px]">
                <span className="px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">D {fmtNum(stats.porcDirecto)}%</span>
                <span className="px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-600 border">I {fmtNum(stats.porcIndirecto)}%</span>
              </div>
            </div>
            <div className="bg-white rounded-2xl border border-zinc-200 p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Fijo vs Variable</span>
                <TrendingUp className="w-3.5 h-3.5 text-zinc-400" />
              </div>
              <div className="flex gap-3 mt-1">
                <div><div className="text-[11px] text-zinc-500">Fijo</div><div className="font-semibold mono text-sm">{fmtMoney(stats.fijo)}</div></div>
                <div className="w-px bg-zinc-200" />
                <div><div className="text-[11px] text-zinc-500">Variable</div><div className="font-semibold mono text-sm">{fmtMoney(stats.variable)}</div></div>
              </div>
            </div>
            <div className="bg-zinc-900 text-white rounded-2xl border border-zinc-900 p-4 relative overflow-hidden">
              <div className="absolute -right-6 -top-6 w-20 h-20 bg-white/10 rounded-full blur-xl" />
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Precio final con IVA</span>
                <DollarSign className="w-3.5 h-3.5 text-zinc-300" />
              </div>
              <div className="text-2xl font-semibold tracking-tight mono">{fmtMoney2(stats.precioConIVA)}</div>
              <div className="mt-2 text-[11px] text-zinc-400">Sin IVA: {fmtMoney2(stats.precioSinIVA)}</div>
            </div>
            <div className="bg-white rounded-2xl border border-zinc-200 p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Margen</span>
                <Percent className="w-3.5 h-3.5 text-zinc-400" />
              </div>
              <div className="text-xl font-semibold tracking-tight mono">{fmtMoney2(stats.margenMonto)}</div>
              <div className="mt-1 text-[11px] text-emerald-700 font-medium">{fmtNum(margen)}% sobre costo + utilidad fija</div>
            </div>
          </div>
        </div>
        )}
      </div>

      {/* PANEL DE MÓDULOS (drawer) */}
      {menuOpen && (
        <div className="fixed inset-0 z-50 flex">

          <div className="bg-zinc-900 text-zinc-300 rounded-2xl p-4 text-[11px] leading-relaxed">
            <div className="flex items-center gap-1.5 font-semibold text-white mb-1">
              <Info className="w-3.5 h-3.5" /> Cómo se calcula cada fila
            </div>
            Cada componente se normaliza a costo por unidad de producto. Los consumibles (periodo "Por unidad") se dividen entre su rendimiento; los recursos periódicos con fecha (renta, sueldos, licencias) usan la fecha y hora exacta de inicio para calcular los días reales de cada periodo (28-31 días según el mes, 365-366 en el año) y prorratean con la producción diaria promedio, en vez de asumir un mes de 30 días fijo. El temporizador de cada fila muestra cuánto falta para que ese periodo venza. Esta es la vista general (todas las fechas); para un costo exacto de un rango específico, usa la pestaña "Reporte por periodo".
          </div>
        </div>
      </div>
      </>
      )}

      {modal && (
        <ComponentModal
          initial={modal.mode === "edit" || modal.mode === "version" ? modal.row : null}
          esNuevaVersion={modal.mode === "version"}
          globalProduccion={produccionGlobal}
          onSave={saveModal}
          onClose={() => setModal(null)}
        />
      )}

      {confirmClear && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-zinc-900/40 backdrop-blur-sm" onClick={() => setConfirmClear(false)} />
          <div className="relative bg-white rounded-2xl border border-zinc-200 shadow-2xl max-w-sm w-full p-5">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-xl bg-red-50 border border-red-200 flex items-center justify-center text-red-600">
                  <TriangleAlert className="w-4 h-4" />
                </div>
                <h4 className="font-semibold text-[14px]">¿Limpiar todo?</h4>
              </div>
              <button onClick={() => setConfirmClear(false)} className="w-7 h-7 rounded-lg border border-zinc-200 flex items-center justify-center">
                <X className="w-4 h-4" />
              </button>
            </div>
            <p className="text-[13px] text-zinc-600 leading-relaxed">Se eliminarán los {components.length} componentes actuales. Esta acción no se puede deshacer.</p>
            <div className="mt-5 flex gap-2 justify-end">
              <button onClick={() => setConfirmClear(false)} className="px-4 py-2 rounded-xl border border-zinc-200 bg-white text-[12px] font-medium">Cancelar</button>
              <button onClick={() => { setComponents([]); setConfirmClear(false); }} className="px-4 py-2 rounded-xl bg-red-600 text-white text-[12px] font-medium hover:bg-red-700">Sí, borrar todo</button>
            </div>
          </div>
        </div>
      )}

      <div className="max-w-[1500px] mx-auto px-4 md:px-6 pb-6 text-center text-[10px] tracking-widest uppercase text-zinc-400">
        Constructor de Precio · 1000 subcategorías · costeo normalizado por unidad de producto
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
