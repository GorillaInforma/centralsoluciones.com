function uid() {
  return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

/* ============================================================
   AUDITORÍA UNIVERSAL DE REGISTROS
   Todo registro de cualquier submódulo (cliente, cotización, pedido,
   factura, nota de crédito, vendedor, etc.) pasa por estas funciones.
   Cada registro guarda: fecha de creación exacta, estado de ciclo de
   vida (activo/cancelado/eliminado) y un historial con fecha y hora
   exacta de cada acción (creado, editado, cancelado, eliminado,
   restaurado), sin importar el submódulo al que pertenezca.
   ============================================================ */
function accionRegistro(tipo, detalle) {
  return { id: uid(), tipo, detalle: detalle || "", fecha: new Date().toISOString() };
}
function crearRegistro(datos, detalleCreacion) {
  return {
    id: uid(),
    fechaCreacion: new Date().toISOString(),
    estado: "activo",
    historial: [accionRegistro("Creado", detalleCreacion || "Registro creado")],
    ...datos,
  };
}
const ESTADO_POR_ACCION = { editar: null, cancelar: "cancelado", borrar: "eliminado", restaurar: "activo" };
const ETIQUETA_ACCION = { editar: "Editado", cancelar: "Cancelado", borrar: "Eliminado", restaurar: "Restaurado" };
function aplicarAccion(setState, id, accion, cambios, detalle) {
  setState((prev) => prev.map((r) => {
    if (r.id !== id) return r;
    const estadoForzado = ESTADO_POR_ACCION[accion];
    return {
      ...r,
      ...(cambios || {}),
      estado: estadoForzado !== null && estadoForzado !== undefined ? estadoForzado : r.estado,
      historial: [...(r.historial || []), accionRegistro(ETIQUETA_ACCION[accion] || accion, detalle)],
    };
  }));
}
const ESTADO_REGISTRO_COLOR = {
  activo: "bg-emerald-50 border-emerald-200 text-emerald-700",
  cancelado: "bg-amber-50 border-amber-200 text-amber-700",
  eliminado: "bg-red-50 border-red-200 text-red-700",
};
const ESTADO_REGISTRO_LABEL = { activo: "Activo", cancelado: "Cancelado", eliminado: "Eliminado" };

/* Barra de acciones estándar: historial (fecha/hora exacta de cada
   acción) + editar / cancelar / eliminar / restaurar, contextual al
   estado actual del registro. Se reutiliza en todos los submódulos. */
function AccionesRegistro({ registro, onEditar, onCancelar, onBorrar, onRestaurar }) {
  const [verHistorial, setVerHistorial] = useState(false);
  const activo = registro.estado === "activo";
  return (
    <div className="relative flex items-center gap-1.5 shrink-0">
      <span className={`text-[10px] px-2 py-0.5 rounded-full border font-medium ${ESTADO_REGISTRO_COLOR[registro.estado] || ESTADO_REGISTRO_COLOR.activo}`}>
        {ESTADO_REGISTRO_LABEL[registro.estado] || registro.estado}
      </span>
      <button onClick={() => setVerHistorial((v) => !v)} title="Ver historial (fecha y hora exacta)" className="w-7 h-7 rounded-lg border border-zinc-200 bg-white flex items-center justify-center hover:bg-zinc-50 transition">
        <Clock className="w-3 h-3" />
      </button>
      {activo && onEditar && (
        <button onClick={onEditar} title="Editar" className="w-7 h-7 rounded-lg border border-zinc-200 bg-white flex items-center justify-center hover:bg-zinc-900 hover:text-white transition">
          <Pencil className="w-3 h-3" />
        </button>
      )}
      {activo && onCancelar && (
        <button onClick={onCancelar} title="Cancelar" className="w-7 h-7 rounded-lg border border-zinc-200 bg-white flex items-center justify-center hover:bg-amber-500 hover:text-white hover:border-amber-500 transition">
          <Ban className="w-3 h-3" />
        </button>
      )}
      {registro.estado !== "eliminado" && onBorrar && (
        <button onClick={onBorrar} title="Borrar" className="w-7 h-7 rounded-lg border border-zinc-200 bg-white flex items-center justify-center hover:bg-red-600 hover:text-white hover:border-red-600 transition">
          <Trash2 className="w-3 h-3" />
        </button>
      )}
      {!activo && onRestaurar && (
        <button onClick={onRestaurar} title="Restaurar" className="w-7 h-7 rounded-lg border border-zinc-200 bg-white flex items-center justify-center hover:bg-emerald-600 hover:text-white hover:border-emerald-600 transition">
          <RotateCcw className="w-3 h-3" />
        </button>
      )}
      {verHistorial && (
        <div className="absolute right-0 top-9 z-20 w-72 bg-white rounded-xl border border-zinc-200 shadow-xl p-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Historial del registro</span>
            <button onClick={() => setVerHistorial(false)} className="w-5 h-5 rounded flex items-center justify-center hover:bg-zinc-100"><X className="w-3 h-3" /></button>
          </div>
          <div className="space-y-1.5 max-h-56 overflow-auto pr-1">
            {(registro.historial || []).slice().reverse().map((h) => (
              <div key={h.id} className="text-[11px] flex items-start justify-between gap-2 border-b border-zinc-100 pb-1.5">
                <span className="font-medium">{h.tipo}{h.detalle ? <span className="text-zinc-500 font-normal"> — {h.detalle}</span> : null}</span>
                <span className="text-zinc-400 shrink-0 mono">{fmtFecha(h.fecha)}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );

/* ============================================================
   FECHAS REALES DE PERIODO
   Periodos con duración calendario exacta (no promedio de 30 días).
   Para éstos, la producción esperada en el periodo se deriva de una
   tasa diaria × los días reales entre fechaInicio y fechaFin, así
   un "Mensual" de 28 días (febrero) no se calcula igual que uno de
   31 días (enero) — precisión real en vez de un promedio fijo.
   ============================================================ */
const PERIODOS_CON_FECHA = ["Diario", "Semanal", "Quincenal", "Mensual", "Bimestral", "Trimestral", "Semestral", "Anual"];

function calcularFechaFin(fechaInicioISO, periodo) {
  const d = new Date(fechaInicioISO);
  if (isNaN(d.getTime())) return null;
  switch (periodo) {
    case "Diario": d.setDate(d.getDate() + 1); break;
    case "Semanal": d.setDate(d.getDate() + 7); break;
    case "Quincenal": d.setDate(d.getDate() + 15); break;
    case "Mensual": d.setMonth(d.getMonth() + 1); break;
    case "Bimestral": d.setMonth(d.getMonth() + 2); break;
    case "Trimestral": d.setMonth(d.getMonth() + 3); break;
    case "Semestral": d.setMonth(d.getMonth() + 6); break;
    case "Anual": d.setFullYear(d.getFullYear() + 1); break;
    default: return null;
  }
  return d;
}

function diasRealesPeriodo(fechaInicioISO, periodo) {
  const inicio = new Date(fechaInicioISO);
  const fin = calcularFechaFin(fechaInicioISO, periodo);
  if (!fin || isNaN(inicio.getTime())) return 30;
  return Math.max((fin.getTime() - inicio.getTime()) / 86400000, 0.0001);
}

function toLocalInputValue(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function fromLocalInputValue(value) {
  if (!value) return new Date().toISOString();
  const d = new Date(value);
  return isNaN(d.getTime()) ? new Date().toISOString() : d.toISOString();
}

const fmtFecha = (iso) => {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "—";
  return new Intl.DateTimeFormat("es-MX", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }).format(d);
};

function formatCountdown(ms) {
  const totalSec = Math.max(Math.floor(ms / 1000), 0);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

function useNow(tickMs) {
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), tickMs);
    return () => clearInterval(id);
  }, [tickMs]);
  return now;
}

/* Temporizador en vivo: cuánto falta para que termine el periodo del componente */
function Countdown({ fechaInicio, periodo, compact }) {
  const now = useNow(1000);
  if (!PERIODOS_CON_FECHA.includes(periodo) || !fechaInicio) return null;
  const fin = calcularFechaFin(fechaInicio, periodo);
  if (!fin) return null;
  const restante = fin.getTime() - now;
  const vencido = restante <= 0;
  return (
    <span className={`inline-flex items-center gap-1 ${compact ? "text-[9px]" : "text-[11px]"} font-medium ${vencido ? "text-red-600" : "text-emerald-600"}`}>
      <Clock className={compact ? "w-2.5 h-2.5" : "w-3 h-3"} />
      {vencido ? "Vencido · renovar" : formatCountdown(restante)}
    </span>
  );
}

/* Rinde/dura se deriva automáticamente: cuánto contiene la compra ÷ cuánto consume cada unidad,
   ambos en la misma unidad de medida. Ya no se captura a mano. */
function calcularRendimiento(c) {
  const cantidadPorUnidad = Number(c.cantidadPorUnidad) || 0;
  const cantidadComprada = Number(c.cantidadComprada) || 0;
  if (cantidadPorUnidad <= 0) return 1;
  return Math.max(cantidadComprada / cantidadPorUnidad, 0.0001);
}

function computeCostoUnidad(c) {
  const costoAdq = Number(c.costoAdquisicion) || 0;
  const cantidadPorUnidad = Number(c.cantidadPorUnidad) || 0;
  const rendimiento = calcularRendimiento(c);
  const esCalendario = PERIODOS_CON_FECHA.includes(c.periodo);
  // En periodos con fecha real, el "veces de uso" ya está implícito en el periodo elegido (1 pago/uso por periodo).
  const vecesUso = esCalendario ? 1 : Number(c.vecesUsoPeriodo) || 1;

  if (PERIODOS_SIN_PRORRATEO.includes(c.periodo)) {
    // Consumible directo: se gasta / repone cada N unidades de producto.
    return (costoAdq * cantidadPorUnidad) / Math.max(rendimiento, 0.0001);
  }

  let produccionPeriodo;
  if (esCalendario && c.fechaInicio) {
    // Precisión real: producción diaria × días reales del periodo (calendario exacto).
    const dias = diasRealesPeriodo(c.fechaInicio, c.periodo);
    produccionPeriodo = (Number(c.produccionDiaria) || 0) * dias;
  } else {
    produccionPeriodo = Number(c.produccionPeriodo) || 1;
  }

  // Recurso periódico compartido: se prorratea entre la producción de ese periodo.
  return (costoAdq * vecesUso * cantidadPorUnidad) / (Math.max(produccionPeriodo, 0.0001) * Math.max(rendimiento, 0.0001));
}

/* ============================================================
   PRODUCCIÓN, VERSIONES Y REPORTE POR RANGO DE FECHAS
   ============================================================ */

// Días de traslape (fracción de día) entre dos rangos de fecha
function diasTraslape(aInicio, aFin, bInicio, bFin) {
  const s = Math.max(aInicio.getTime(), bInicio.getTime());
  const e = Math.min(aFin.getTime(), bFin.getTime());
  return Math.max((e - s) / 86400000, 0);
}

// Suma la producción real registrada que cae dentro del rango [desde, hasta],
// prorrateando cada evento por su fracción de traslape (evita asumir producción promedio).
function computeProduccionEnRango(entradas, desdeISO, hastaISO) {
  const desde = new Date(desdeISO), hasta = new Date(hastaISO);
  if (isNaN(desde.getTime()) || isNaN(hasta.getTime())) return 0;
  return entradas.reduce((total, ev) => {
    const ini = new Date(ev.fechaInicio);
    const fin = ev.fechaFin ? new Date(ev.fechaFin) : new Date(); // "en curso" cuenta hasta ahora
    if (isNaN(ini.getTime()) || isNaN(fin.getTime()) || fin <= ini) return total;
    const duracionTotal = Math.max((fin - ini) / 86400000, 0.0001);
    const traslape = diasTraslape(ini, fin, desde, hasta);
    return total + (Number(ev.cantidadTotal) || 0) * (traslape / duracionTotal);
  }, 0);
}

// Para cada concepto (groupId) con varias versiones a través del tiempo, elige la
// versión "más reciente" o "más vieja" según la preferencia guardada para ESE componente.
function pickRepresentatives(rows, preferencias, hastaISO) {
  const grupos = {};
  rows.forEach((r) => { (grupos[r.groupId] = grupos[r.groupId] || []).push(r); });
  return Object.values(grupos).map((versiones) => {
    const groupId = versiones[0].groupId;
    const pref = preferencias[groupId] || "reciente";
    const ordenadas = [...versiones].sort((a, b) => new Date(a.fechaInicio) - new Date(b.fechaInicio));
    let candidatas = ordenadas;
    if (hastaISO) {
      const filtradas = ordenadas.filter((v) => new Date(v.fechaInicio) <= new Date(hastaISO));
      candidatas = filtradas.length ? filtradas : ordenadas;
    }
    return pref === "vieja" ? candidatas[0] : candidatas[candidatas.length - 1];
  });
}

/* Calcula el costo por unidad EXACTO para un rango [desde, hasta], usando:
   - la producción real registrada en ese rango (módulo Producción), no un promedio
   - por cada concepto, la versión de costo elegida individualmente (más vieja/reciente) */
function computeReportePorRango({ components, preferencias, produccion, desdeISO, hastaISO }) {
  const produccionRango = computeProduccionEnRango(produccion, desdeISO, hastaISO);
  const incluidos = components.filter((c) => c.incluido);
  const representantes = pickRepresentatives(incluidos, preferencias, hastaISO);
  const desde = new Date(desdeISO), hasta = new Date(hastaISO);

  let consumibles = 0;
  let periodicosTotal = 0;
  const detalle = [];

  representantes.forEach((c) => {
    const fechaRegistro = new Date(c.fechaInicio);
    if (isNaN(fechaRegistro.getTime()) || fechaRegistro > hasta) return; // aún no existía en el rango
    const rendimiento = calcularRendimiento(c);

    if (PERIODOS_SIN_PRORRATEO.includes(c.periodo)) {
      const v = computeCostoUnidad(c);
      consumibles += v;
      detalle.push({ c, aporte: v, tipoCalculo: "consumible" });
    } else if (c.periodo === "Por lote") {
      // Evento discreto: solo cuenta si el registro cae dentro del rango elegido.
      if (fechaRegistro >= desde && fechaRegistro <= hasta) {
        const v = computeCostoUnidad(c);
        consumibles += v;
        detalle.push({ c, aporte: v, tipoCalculo: "lote" });
      }
      return;
    } else {
      const dias = diasRealesPeriodo(c.fechaInicio, c.periodo);
      const costoDiario = (c.costoAdquisicion * (Number(c.vecesUsoPeriodo) || 1) * c.cantidadPorUnidad) / (Math.max(dias, 0.0001) * Math.max(rendimiento, 0.0001));
      const inicioEfectivo = fechaRegistro > desde ? fechaRegistro : desde;
      const diasEfectivos = Math.max((hasta - inicioEfectivo) / 86400000, 0);
      const aporte = costoDiario * diasEfectivos;
      periodicosTotal += aporte;
      detalle.push({ c, aporte, costoDiario, diasEfectivos, tipoCalculo: "periodico" });
    }
  });

  const costoPorUnidad = consumibles + (produccionRango > 0 ? periodicosTotal / produccionRango : 0);
  return { produccionRango, consumibles, periodicosTotal, costoPorUnidad, detalle };
}

/* ============================================================
   BUSCADOR DE SUBCATEGORÍA (combobox con filtro, 25 por categoría)
   ============================================================ */
function SubcategoriaPicker({ categoria, value, onChange }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const options = SUBCATS[categoria] || [];
  const filtered = q.trim()
    ? options.filter((o) => o.toLowerCase().includes(q.toLowerCase()))
    : options;

  return (
    <div className="relative">
      <button
        type="button"
        onClick={() => setOpen((o) => !o)}
        className="w-full flex items-center justify-between gap-2 bg-white border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] text-left outline-none focus:border-zinc-900 hover:border-zinc-300 transition"
      >
        <span className={value ? "truncate" : "truncate text-zinc-400"}>
          {value || "Elige una subcategoría..."}
        </span>
        <ChevronDown className="w-4 h-4 text-zinc-400 shrink-0" />
      </button>
      {open && (
        <div className="absolute z-40 mt-1.5 w-full bg-white border border-zinc-200 rounded-xl shadow-2xl overflow-hidden">
          <div className="p-2 border-b border-zinc-100">
            <div className="flex items-center gap-1.5 bg-zinc-50 border border-zinc-200 rounded-lg px-2.5 py-1.5">
              <Search className="w-3.5 h-3.5 text-zinc-400 shrink-0" />
              <input
                autoFocus
                value={q}
                onChange={(e) => setQ(e.target.value)}
                placeholder={`Buscar entre ${options.length} subcategorías...`}
                className="w-full bg-transparent outline-none text-[12px] placeholder:text-zinc-400"
              />
            </div>
          </div>
          <div className="max-h-56 overflow-auto py-1">
            {filtered.length === 0 && (
              <div className="px-3 py-3 text-[12px] text-zinc-400">Sin resultados.</div>
            )}
            {filtered.map((opt) => (
              <button
                type="button"
                key={opt}
                onClick={() => {
                  onChange(opt);
                  setOpen(false);
                  setQ("");
                }}
                className={`w-full text-left px-3 py-2 text-[12px] flex items-center justify-between gap-2 hover:bg-zinc-50 transition ${
                  opt === value ? "bg-zinc-50 font-medium" : ""
                }`}
              >
                <span className="truncate">{opt}</span>
                {opt === value && <Check className="w-3.5 h-3.5 text-zinc-900 shrink-0" />}
              </button>
            ))}
          </div>
        </div>
      )}
      {open && <div className="fixed inset-0 z-30" onClick={() => setOpen(false)} />}
    </div>
  );
}

            <label className="flex flex-col gap-1.5 col-span-1">
              <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Periodo</span>
              <select value={draft.periodo} onChange={(e) => set("periodo", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 focus:bg-white">
                {PERIODOS.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </label>
            <label className="flex flex-col gap-1.5 col-span-2 md:col-span-2">
              <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Costo de adquisición ($)</span>
              <div className="flex items-center gap-1 bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 focus-within:border-zinc-900 focus-within:bg-white">
                <span className="text-zinc-400 text-xs">$</span>
                <input type="number" step="0.01" value={draft.costoAdquisicion} onChange={(e) => set("costoAdquisicion", Number(e.target.value))} className="w-full bg-transparent outline-none text-[13px] mono" />
              </div>
            </label>
          </div>

          {(
            <div className="rounded-xl border border-zinc-200 bg-zinc-50/60 p-4 space-y-3">
              <div className="flex items-center gap-1.5 text-[11px] font-semibold text-zinc-600">
                <Clock className="w-3.5 h-3.5" /> Fecha de registro de este costo
              </div>
              <div className="text-[10px] text-zinc-500 -mt-2">
                Se guarda siempre, incluso en "Por unidad" — es lo que permite saber qué versión de este concepto
                estaba vigente en cada periodo, sin aproximar caducidades.
              </div>
              <div className="flex flex-col md:flex-row gap-3 md:items-end">
                <label className="flex flex-col gap-1.5 flex-1">
                  <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">
                    Fecha de registro
                  </span>
                  <input
                    type="datetime-local"
                    step="1"
                    value={toLocalInputValue(draft.fechaInicio)}
                    onChange={(e) => set("fechaInicio", fromLocalInputValue(e.target.value))}
                    className="w-full bg-white border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono"
                  />
                </label>
                <button
                  type="button"
                  onClick={() => set("fechaInicio", new Date().toISOString())}
                  className="px-3 py-2.5 rounded-xl border border-zinc-200 bg-white text-[12px] font-medium hover:bg-zinc-50 transition whitespace-nowrap"
                >
                  Usar ahora
                </button>
              </div>

              {esConFecha && (
                <div className="rounded-lg bg-white border border-zinc-200 p-3 flex flex-col gap-2">
                  <div className="flex items-center justify-between flex-wrap gap-2">
                    <span className="text-[11px] text-zinc-500">
                      Vence: <span className="font-medium text-zinc-700">{fmtFecha(fechaFin)}</span>
                      <span className="text-zinc-400"> · {fmtNum(diasReales)} días reales de este periodo</span>
                    </span>
                    <Countdown fechaInicio={draft.fechaInicio} periodo={draft.periodo} />
                  </div>
                </div>
              )}
            </div>
          )}

          <div className="rounded-xl border border-zinc-200 bg-zinc-50/60 p-4 space-y-3">
            <div className="flex items-center gap-1.5 text-[11px] font-semibold text-zinc-600">
              <Boxes className="w-3.5 h-3.5" /> Lógica de consumo por unidad de producto
            </div>
            <div className="grid grid-cols-1 md:grid-cols-[110px_1fr] gap-3">
              <label className="flex flex-col gap-1.5">
                <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">
                  Unidad
                </span>
                <select value={draft.unidad} onChange={(e) => set("unidad", e.target.value)} className="w-full bg-white border border-zinc-200 rounded-xl px-2 py-2.5 text-[13px] outline-none focus:border-zinc-900">
                  {UNIDADES.map((u) => <option key={u} value={u}>{u}</option>)}
                </select>
              </label>
              <label className="flex flex-col gap-1.5">
                <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">
                  Cantidad que consume cada unidad a producir
                </span>
                <input type="number" step="0.001" value={draft.cantidadPorUnidad} onChange={(e) => set("cantidadPorUnidad", Number(e.target.value))} className="w-full bg-white border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
                <span className="text-[10px] text-zinc-500">Ej: 0.3 kg, 2 piezas, 0.05 horas por cada unidad de producto.</span>
              </label>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-[110px_1fr] gap-3 items-start">
              <div />
              <label className="flex flex-col gap-1.5">
                <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">
                  Cuánto contiene/rinde esta compra (en {draft.unidad})
                </span>
                <input type="number" step="0.001" value={draft.cantidadComprada} onChange={(e) => set("cantidadComprada", Number(e.target.value))} className="w-full bg-white border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
                <span className="text-[10px] text-zinc-500">
                  Ej: compras una bolsa de 25 kg, un rollo de 100 m, un molde que aguanta 50,000 usos.
                </span>
                <span className="text-[11px] text-zinc-700 bg-white border border-zinc-200 rounded-lg px-2.5 py-1.5 inline-flex items-center gap-1.5 w-fit">
                  <Repeat className="w-3 h-3 text-zinc-400" />
                  Rinde/dura (calculado): <span className="font-semibold">{fmtNum(calcularRendimiento(draft))} unidades de producto</span>
                </span>
              </label>
            </div>

            {esPeriodico && (
              esConFecha ? (
                <div className="pt-1 border-t border-zinc-200/70">
                  <label className="flex flex-col gap-1.5 pt-3">
                    <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500 flex items-center gap-1">
                      <Clock className="w-3 h-3" /> Producción diaria promedio
                    </span>
                    <input type="number" step="1" value={draft.produccionDiaria} onChange={(e) => set("produccionDiaria", Number(e.target.value))} className="w-full md:w-1/2 bg-white border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
                    <span className="text-[10px] text-zinc-500">
                      Unidades/día. Con {fmtNum(diasReales)} días reales del periodo ⇒ producción estimada del periodo: <span className="font-medium text-zinc-700">{fmtNum(produccionCalculada)} unidades</span>. Se asume 1 pago/uso por periodo (ya definido por la fecha y el periodo elegidos arriba).
                    </span>
                  </label>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1 border-t border-zinc-200/70">
                  <label className="flex flex-col gap-1.5 pt-3">
                    <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500 flex items-center gap-1">
                      <Repeat className="w-3 h-3" /> Veces que se usa/paga por lote
                    </span>
                    <input type="number" step="1" value={draft.vecesUsoPeriodo} onChange={(e) => set("vecesUsoPeriodo", Number(e.target.value))} className="w-full bg-white border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
                    <span className="text-[10px] text-zinc-500">Ej: un insumo se compra 3 veces por lote de producción.</span>
                  </label>
                  <label className="flex flex-col gap-1.5 pt-3">
                    <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500 flex items-center gap-1">
                      <Clock className="w-3 h-3" /> Producción del producto en ese lote
                    </span>
                    <input type="number" step="1" value={draft.produccionPeriodo} onChange={(e) => set("produccionPeriodo", Number(e.target.value))} className="w-full bg-white border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
                    <span className="text-[10px] text-zinc-500">Unidades fabricadas en ese lote, para prorratear el costo.</span>
                  </label>
                </div>
              )
            )}
          </div>

          {/* Preview */}
          <div className="rounded-xl bg-zinc-900 text-white p-4">
            <div className="flex items-center gap-1.5 text-[10px] font-semibold tracking-widest uppercase text-zinc-400 mb-2">
              <Calculator className="w-3.5 h-3.5" /> Costo resultante por unidad de producto
            </div>
            <div className="text-2xl font-semibold mono tracking-tight">{fmtMoney(costoPreview)}</div>
            <div className="text-[11px] text-zinc-400 mt-1.5 leading-relaxed">
              {esConFecha
                ? `(${fmtMoney2(draft.costoAdquisicion)} × ${fmtNum(draft.cantidadPorUnidad)}) ÷ (${fmtNum(draft.produccionDiaria)} uds/día × ${fmtNum(diasReales)} días reales × rinde ${fmtNum(calcularRendimiento(draft))})`
                : esPeriodico
                ? `(${fmtMoney2(draft.costoAdquisicion)} × ${fmtNum(draft.vecesUsoPeriodo)} usos × ${fmtNum(draft.cantidadPorUnidad)}) ÷ (${fmtNum(draft.produccionPeriodo)} unidades × rinde ${fmtNum(calcularRendimiento(draft))})`
                : `(${fmtMoney2(draft.costoAdquisicion)} × ${fmtNum(draft.cantidadPorUnidad)}) ÷ rinde ${fmtNum(calcularRendimiento(draft))} unidades`}
            </div>
          </div>

          <div className="flex items-center gap-2 pt-1">
            <label className="flex items-center gap-2 text-[12px] text-zinc-600 mr-auto">
              <input type="checkbox" checked={draft.incluido} onChange={(e) => set("incluido", e.target.checked)} className="w-4 h-4 rounded border-zinc-300" />
              Incluir en el cálculo del precio
            </label>
            <button onClick={onClose} className="px-4 py-2.5 rounded-xl border border-zinc-200 bg-white text-[12px] font-medium hover:bg-zinc-50 transition">
              Cancelar
            </button>
            <button
              onClick={() => canSave && onSave(draft)}
              disabled={!canSave}
              className="px-5 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black disabled:opacity-40 transition flex items-center gap-1.5"
            >
              <Plus className="w-4 h-4" /> {initial ? "Guardar cambios" : "Agregar componente"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PESTAÑA: PRODUCCIÓN — bitácora real, con fecha/hora exacta,
   selección obligatoria de producto/servicio y rango con 2 calendarios
   ============================================================ */
/* ============================================================
   DASHBOARD REUTILIZABLE — fila de KPIs arriba de cada submódulo
   ============================================================ */
function KpiCard({ label, value, hint, Icon, tone, valueClass }) {
  const dark = tone === "dark";
  const warn = tone === "warn";
  return (
    <div className={`rounded-2xl border p-4 relative overflow-hidden ${
      dark ? "bg-zinc-900 text-white border-zinc-900" : warn ? "bg-amber-50 border-amber-200" : "bg-white border-zinc-200"
    }`}>
      <div className="flex items-center justify-between mb-2">
        <span className={`text-[10px] font-semibold tracking-widest uppercase ${dark ? "text-zinc-400" : warn ? "text-amber-700" : "text-zinc-500"}`}>{label}</span>
        {Icon && <Icon className={`w-3.5 h-3.5 ${dark ? "text-zinc-300" : warn ? "text-amber-500" : "text-zinc-400"}`} />}
      </div>
      <div className={`text-xl font-semibold tracking-tight mono ${valueClass || ""}`}>{value}</div>
      {hint && <div className={`mt-1.5 text-[11px] ${dark ? "text-zinc-400" : warn ? "text-amber-700" : "text-zinc-500"}`}>{hint}</div>}
    </div>
  );
}

function DashboardKpis({ title, items }) {
  return (
    <div className="mb-1">
      {title && (
        <div className="text-[10px] font-semibold tracking-widest uppercase text-zinc-400 mb-2 flex items-center gap-1.5">
          <TrendingUp className="w-3 h-3" /> {title}
        </div>
      )}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        {items.map((it, i) => <KpiCard key={i} {...it} />)}
      </div>
    </div>
  );
}

function ProduccionTab({ produccion, setProduccion, productos }) {
  const ahora = new Date();
  const manana = new Date(ahora);
  manana.setDate(manana.getDate() + 1);

  const [form, setForm] = useState({
    productoId: "",
    fechaInicio: ahora.toISOString(),
    fechaFin: manana.toISOString(),
    enCurso: false,
    cantidadTotal: 100,
  });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const duracionMs = form.enCurso ? 0 : (new Date(form.fechaFin) - new Date(form.fechaInicio));
  const duracionDias = duracionMs > 0 ? duracionMs / 86400000 : 0;
  const rangoValido = form.productoId && (form.enCurso || duracionMs > 0);

  const productoSeleccionado = productos.find((p) => p.id === form.productoId);

  const agregar = () => {
    if (!rangoValido) return;
    setProduccion((prev) => [{
      id: uid(),
      productoId: form.productoId,
      productoNombre: productoSeleccionado?.nombre || "—",
      fechaInicio: form.fechaInicio,
      fechaFin: form.enCurso ? null : form.fechaFin,
      cantidadTotal: Number(form.cantidadTotal),
    }, ...prev]);
  };

  const cerrar = (id) => setProduccion((prev) => prev.map((e) => (e.id === id ? { ...e, fechaFin: new Date().toISOString() } : e)));
  const eliminar = (id) => setProduccion((prev) => prev.filter((e) => e.id !== id));
  const totalRegistrado = produccion.reduce((s, e) => s + (Number(e.cantidadTotal) || 0), 0);
  const enCursoCount = produccion.filter((e) => !e.fechaFin).length;
  const cerrados = produccion.filter((e) => e.fechaFin);
  const duracionPromedio = cerrados.length
    ? cerrados.reduce((s, e) => s + (new Date(e.fechaFin) - new Date(e.fechaInicio)) / 86400000, 0) / cerrados.length
    : 0;
  const productoTop = (() => {
    const m = {};
    produccion.forEach((e) => { const k = e.productoNombre || "—"; m[k] = (m[k] || 0) + (Number(e.cantidadTotal) || 0); });
    const arr = Object.entries(m).sort((a, b) => b[1] - a[1]);
    return arr[0] || null;
  })();

  return (
    <div className="max-w-[1500px] mx-auto px-4 md:px-6 py-4 space-y-4">
      <DashboardKpis
        title="Resumen de producción"
        items={[
          { label: "Eventos registrados", value: produccion.length, Icon: Boxes, hint: `${enCursoCount} en curso` },
          { label: "Unidades producidas", value: fmtNum(totalRegistrado), Icon: Package },
          { label: "Duración prom. de lote", value: cerrados.length ? `${fmtNum(duracionPromedio)} días` : "—", Icon: Clock, hint: `${cerrados.length} lote(s) cerrados` },
          { label: "Producto líder", value: productoTop ? productoTop[0] : "—", Icon: TrendingUp, hint: productoTop ? `${fmtNum(productoTop[1])} unidades` : "sin datos", tone: "dark" },
        ]}
      />
      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3 flex items-center gap-2">
          <Boxes className="w-4 h-4" /> Registrar producción real
        </h3>

        {/* Selector obligatorio de producto/servicio */}
        <div className="mb-4">
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500 flex items-center gap-1">
              <Package className="w-3 h-3" /> Producto o servicio <span className="text-red-500">*</span>
            </span>
            {productos.length === 0 ? (
              <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2.5 text-[12px] text-amber-700">
                <TriangleAlert className="w-4 h-4 shrink-0" />
                Primero da de alta un producto o servicio en la pestaña "Productos y servicios".
              </div>
            ) : (
              <select
                value={form.productoId}
                onChange={(e) => set("productoId", e.target.value)}
                className={`bg-zinc-50 border rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 ${!form.productoId ? "border-amber-300 bg-amber-50" : "border-zinc-200"}`}
              >
                <option value="">— Selecciona un producto o servicio —</option>
                {productos.map((p) => (
                  <option key={p.id} value={p.id}>{p.nombre}</option>
                ))}
              </select>
            )}
          </label>
          {form.productoId && productoSeleccionado && (
            <div className="mt-1.5 text-[11px] text-zinc-500">
              {productoSeleccionado.asignaciones.length} componente(s) asignado(s) a este producto se usarán en el cálculo de costo por unidad.
            </div>
          )}
        </div>

        {/* Rango de fechas: inicio y fin */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500 flex items-center gap-1">
              <Clock className="w-3 h-3" /> Fecha y hora de inicio
            </span>
            <input
              type="datetime-local"
              step="1"
              value={toLocalInputValue(form.fechaInicio)}
              onChange={(e) => set("fechaInicio", fromLocalInputValue(e.target.value))}
              className="bg-white border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono"
            />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500 flex items-center gap-1">
              <Clock className="w-3 h-3" /> Fecha y hora de fin
            </span>
            {form.enCurso ? (
              <div className="flex items-center gap-2 bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2.5 text-[12px] text-emerald-700 font-medium">
                <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse" /> En curso (sin fecha fin)
              </div>
            ) : (
              <input
                type="datetime-local"
                step="1"
                value={toLocalInputValue(form.fechaFin)}
                onChange={(e) => set("fechaFin", fromLocalInputValue(e.target.value))}
                className={`bg-white border rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono ${duracionMs <= 0 && !form.enCurso ? "border-red-300 bg-red-50" : "border-zinc-200"}`}
              />
            )}
          </label>
        </div>

        {/* Toggle en curso + resumen de duración */}
        <div className="flex flex-wrap items-center gap-4 mb-3">
          <label className="flex items-center gap-2 text-[12px] text-zinc-600 cursor-pointer select-none">
            <input
              type="checkbox"
              checked={form.enCurso}
              onChange={(e) => set("enCurso", e.target.checked)}
              className="w-4 h-4 rounded border-zinc-300"
            />
            Todavía en curso (sin fecha fin)
          </label>
          {!form.enCurso && duracionDias > 0 && (
            <span className="text-[11px] text-zinc-500 bg-zinc-50 border border-zinc-200 rounded-lg px-2.5 py-1">
              Duración: <span className="font-semibold text-zinc-700">{fmtNum(duracionDias)} días</span>
            </span>
          )}
          {!form.enCurso && duracionMs <= 0 && (
            <span className="text-[11px] text-red-600">La fecha de fin debe ser posterior al inicio</span>
          )}
        </div>

        {/* Cantidad producida + botón */}
        <div className="flex flex-wrap gap-3 items-end">
          <label className="flex flex-col gap-1.5 flex-1 min-w-[160px]">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Cantidad total producida</span>
            <input
              type="number"
              step="1"
              value={form.cantidadTotal}
              onChange={(e) => set("cantidadTotal", Number(e.target.value))}
              className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono"
            />
          </label>
          <button
            onClick={agregar}
            disabled={!rangoValido}
            className="px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition flex items-center justify-center gap-1.5 disabled:opacity-40"
          >
            <Plus className="w-4 h-4" /> Registrar
          </button>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-200 bg-zinc-50/50 flex items-center justify-between">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase">Bitácora de producción</h3>
          <span className="text-[11px] text-zinc-500">{produccion.length} eventos · {fmtNum(totalRegistrado)} unidades totales</span>
        </div>
        {produccion.length === 0 && (
          <div className="p-6 text-center text-[13px] text-zinc-500">Aún no registras producción. Agrega tu primer evento arriba.</div>
        )}
        {produccion.map((e) => {
          const enCurso = !e.fechaFin;
          return (
            <div key={e.id} className="px-4 py-3 border-b border-zinc-100 flex items-center justify-between gap-3 text-[12px]">
              <div>
                <div className="font-medium flex items-center gap-2">
                  {fmtNum(e.cantidadTotal)} unidades
                  {e.productoNombre && (
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-zinc-100 border border-zinc-200 text-zinc-600 font-normal">{e.productoNombre}</span>
                  )}
                </div>
                <div className="text-zinc-500 text-[11px]">
                  {fmtFecha(e.fechaInicio)} → {enCurso ? <span className="text-emerald-600 font-medium">en curso</span> : fmtFecha(e.fechaFin)}
                  {!enCurso && (() => {
                    const dias = (new Date(e.fechaFin) - new Date(e.fechaInicio)) / 86400000;
                    return <span className="ml-1.5 px-1.5 py-0.5 rounded-full bg-zinc-100 text-zinc-500 text-[10px]">{fmtNum(dias)} días</span>;
                  })()}
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                {enCurso && (
                  <button onClick={() => cerrar(e.id)} className="px-2.5 py-1.5 rounded-lg border border-zinc-200 bg-white text-[11px] font-medium hover:bg-zinc-900 hover:text-white transition flex items-center gap-1">
                    <Check className="w-3 h-3" /> Cerrar ahora
                  </button>
                )}
                <button onClick={() => eliminar(e.id)} className="w-7 h-7 rounded-lg border border-zinc-200 bg-white flex items-center justify-center hover:bg-red-600 hover:text-white hover:border-red-600 transition">
                  <Trash2 className="w-3 h-3" />
                </button>
              </div>
            </div>

}

/* ============================================================
   PESTAÑA: PRODUCTOS Y SERVICIOS — qué componentes usa cada uno
   ============================================================ */
function ProductosTab({ components, preferenciasVersion, productos, setProductos }) {
  const conceptos = useMemo(() => pickRepresentatives(components, preferenciasVersion, null), [components, preferenciasVersion]);
  const [nombreNuevo, setNombreNuevo] = useState("");

  const asignados = new Set();
  productos.forEach((p) => p.asignaciones.forEach((a) => asignados.add(a.groupId)));
  const sinAsignar = conceptos.filter((c) => !asignados.has(c.groupId));

  const agregarProducto = () => {
    if (!nombreNuevo.trim()) return;
    setProductos((prev) => [{ id: uid(), nombre: nombreNuevo.trim(), asignaciones: [] }, ...prev]);
    setNombreNuevo("");
  };
  const eliminarProducto = (id) => setProductos((prev) => prev.filter((p) => p.id !== id));
  const asignar = (productoId, groupId, estado) =>
    setProductos((prev) => prev.map((p) => {
      if (p.id !== productoId) return p;
      const sinDuplicado = p.asignaciones.filter((a) => a.groupId !== groupId);
      return { ...p, asignaciones: [...sinDuplicado, { groupId, estado }] };
    }));
  const desasignar = (productoId, groupId) =>
    setProductos((prev) => prev.map((p) => (p.id === productoId ? { ...p, asignaciones: p.asignaciones.filter((a) => a.groupId !== groupId) } : p)));

  const totalAsignaciones = productos.reduce((s, p) => s + p.asignaciones.length, 0);
  const promedioPorProducto = productos.length ? totalAsignaciones / productos.length : 0;
  const productoTop = [...productos].sort((a, b) => b.asignaciones.length - a.asignaciones.length)[0] || null;

  return (
    <div className="max-w-[1500px] mx-auto px-4 md:px-6 py-4 space-y-4">
      <DashboardKpis
        title="Resumen de catálogo"
        items={[
          { label: "Productos / servicios", value: productos.length, Icon: Package },
          { label: "Componentes asignados", value: totalAsignaciones, Icon: Layers, hint: `${fmtNum(promedioPorProducto)} en promedio por producto` },
          { label: "Sin asignar", value: sinAsignar.length, Icon: TriangleAlert, tone: sinAsignar.length > 0 ? "warn" : undefined, hint: `de ${conceptos.length} conceptos totales` },
          { label: "Ficha más completa", value: productoTop ? productoTop.nombre : "—", Icon: Info, hint: productoTop ? `${productoTop.asignaciones.length} componentes` : "sin datos", tone: "dark" },
        ]}
      />
      <div className="bg-white rounded-2xl border border-zinc-200 p-4 flex gap-2 items-end">
        <label className="flex flex-col gap-1.5 flex-1">
          <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Nuevo producto o servicio</span>
          <input value={nombreNuevo} onChange={(e) => setNombreNuevo(e.target.value)} placeholder="Ej: Modelo A, Servicio premium..." className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
        </label>
        <button onClick={agregarProducto} className="px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition flex items-center gap-1.5">
          <Plus className="w-4 h-4" /> Agregar
        </button>
      </div>

      {productos.length === 0 && (
        <div className="bg-white rounded-2xl border border-zinc-200 p-6 text-center text-[13px] text-zinc-500">
          Aún no tienes productos o servicios registrados.
        </div>
      )}

      {productos.map((p) => (
        <div key={p.id} className="bg-white rounded-2xl border border-zinc-200 p-4">
          <div className="flex items-center justify-between mb-3">
            <h4 className="text-[13px] font-semibold">{p.nombre}</h4>
            <button onClick={() => eliminarProducto(p.id)} className="w-7 h-7 rounded-lg border border-zinc-200 bg-white flex items-center justify-center hover:bg-red-600 hover:text-white hover:border-red-600 transition">
              <Trash2 className="w-3 h-3" />
            </button>
          </div>
          <AsignadorComponente conceptos={conceptos} onAsignar={(groupId, estado) => asignar(p.id, groupId, estado)} />
          <div className="mt-3 space-y-1.5">
            {p.asignaciones.length === 0 && <div className="text-[12px] text-zinc-400">Sin componentes asignados todavía.</div>}
            {p.asignaciones.map((a) => {
              const comp = conceptos.find((c) => c.groupId === a.groupId);
              if (!comp) return null;
              return (
                <div key={a.groupId} className="flex items-center justify-between gap-2 text-[12px] bg-zinc-50 rounded-lg px-3 py-2">
                  <span className="truncate">{comp.concepto || comp.subcategoria}</span>
                  <div className="flex items-center gap-2 shrink-0">
                    <span className={`text-[10px] px-2 py-0.5 rounded-full border ${a.estado === "actual" ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-amber-50 text-amber-700 border-amber-200"}`}>
                      {a.estado === "actual" ? "en uso actual" : "uso futuro"}
                    </span>
                    <button onClick={() => desasignar(p.id, a.groupId)} className="text-zinc-400 hover:text-red-600">
                      <X className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}

      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h4 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-2">Sin asignar aún ({sinAsignar.length})</h4>
        <div className="flex flex-wrap gap-1.5">
          {sinAsignar.map((c) => (
            <span key={c.groupId} className="text-[11px] px-2 py-1 rounded-lg bg-zinc-50 border border-zinc-200 text-zinc-600">{c.concepto || c.subcategoria}</span>
          ))}
          {sinAsignar.length === 0 && <span className="text-[12px] text-zinc-400">Todos los componentes están asignados a algún producto.</span>}
        </div>
      </div>
    </div>
  );
}

function AsignadorComponente({ conceptos, onAsignar }) {
  const [groupId, setGroupId] = useState("");

  return (
    <div className="flex flex-wrap gap-2 items-end bg-zinc-50/60 border border-zinc-200 rounded-xl p-3">

/* ============================================================
   HISTORIAL DE COSTOS DE ADQUISICIÓN (Compras / Abastecimiento)
   ============================================================ */
function HistorialCostosTab({ rows, preferenciasVersion, togglePreferencia }) {
  const grupos = useMemo(() => {
    const m = {};
    rows.forEach((c) => { (m[c.groupId] = m[c.groupId] || []).push(c); });
    return Object.values(m)
      .filter((v) => v.length > 1)
      .map((v) => [...v].sort((a, b) => new Date(a.fechaInicio) - new Date(b.fechaInicio)));
  }, [rows]);

  let subieron = 0, bajaron = 0, mayorSalto = 0, transiciones = 0;
  grupos.forEach((versiones) => {
    for (let i = 1; i < versiones.length; i++) {
      const a = versiones[i - 1], b = versiones[i];
      if (a.costoAdquisicion > 0) {
        transiciones++;
        const cambio = ((b.costoAdquisicion - a.costoAdquisicion) / a.costoAdquisicion) * 100;
        if (cambio > 0) subieron++; else if (cambio < 0) bajaron++;
        if (Math.abs(cambio) > Math.abs(mayorSalto)) mayorSalto = cambio;
      }
    }
  });
  const usandoVieja = Object.values(preferenciasVersion).filter((v) => v === "vieja").length;

  return (
    <div className="max-w-[1500px] mx-auto px-4 md:px-6 py-4 space-y-4">
      <DashboardKpis
        title="Resumen de historial"
        items={[
          { label: "Conceptos con historial", value: grupos.length, Icon: Layers },
          { label: "Cambios de precio", value: transiciones, Icon: Repeat, hint: `${subieron} subieron · ${bajaron} bajaron` },
          { label: "Mayor variación", value: `${mayorSalto > 0 ? "+" : ""}${fmtNum(mayorSalto)}%`, Icon: TrendingUp, tone: mayorSalto > 0 ? "warn" : undefined },
          { label: "Usando versión vieja", value: usandoVieja, Icon: Clock, hint: `de ${grupos.length} con historial`, tone: "dark" },
        ]}
      />
      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-1 flex items-center gap-2">
          <Clock className="w-4 h-4" /> Historial de costos de adquisición
        </h3>
        <p className="text-[12px] text-zinc-500">Evolución de precio de cada concepto con más de una versión registrada. Elige cuál versión usar en los cálculos.</p>
      </div>
      {grupos.length === 0 && (
        <div className="bg-white rounded-2xl border border-zinc-200 p-10 text-center text-[13px] text-zinc-500">
          Ningún concepto tiene todavía más de una versión. Usa el botón de reloj en Costeos para registrar una nueva versión de un insumo cuando cambie su precio.
        </div>
      )}
      <div className="space-y-3">
        {grupos.map((versiones) => {
          const groupId = versiones[0].groupId;
          const pref = preferenciasVersion[groupId] || "reciente";
          return (
            <div key={groupId} className="bg-white rounded-2xl border border-zinc-200 p-4">
              <div className="flex items-center justify-between mb-3">
                <div className="font-medium text-[13px]">{versiones[0].concepto || versiones[0].subcategoria}</div>
                <button
                  onClick={() => togglePreferencia(groupId)}
                  className="inline-flex items-center gap-1 text-[10px] px-2 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100"
                >
                  <Repeat className="w-3 h-3" /> usando {pref === "reciente" ? "más reciente" : "más vieja"}
                </button>
              </div>
              <div className="space-y-1.5">
                {versiones.map((v, i) => {
                  const anterior = versiones[i - 1];
                  const cambio =
                    anterior && anterior.costoAdquisicion > 0
                      ? ((v.costoAdquisicion - anterior.costoAdquisicion) / anterior.costoAdquisicion) * 100
                      : null;
                  return (
                    <div key={v.id} className="flex items-center justify-between text-[12px] px-3 py-2 rounded-xl bg-zinc-50 border border-zinc-100">
                      <span className="text-zinc-500 mono text-[11px]">{fmtFecha(v.fechaInicio)}</span>
                      <span className="mono font-medium">{fmtMoney2(v.costoAdquisicion)}</span>
                      {cambio !== null && (
                        <span className={`text-[11px] mono px-2 py-0.5 rounded-full ${cambio > 0 ? "bg-red-50 text-red-700 border border-red-200" : cambio < 0 ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-zinc-100 text-zinc-500"}`}>
                          {cambio > 0 ? "+" : ""}{fmtNum(cambio)}%
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   MÓDULO VENTAS — 6 submódulos reales e interconectados en cascada:
   Clientes → Cotizaciones → Pedidos → Facturación → Notas de Crédito
   → Comisiones. Cada acción (crear, editar, cancelar, borrar,
   restaurar) queda registrada con fecha y hora exacta vía
   AccionesRegistro/crearRegistro/aplicarAccion (helpers universales).
   Las facturas activas y no canceladas alimentan en vivo Cuentas por
   Cobrar en Contabilidad — ver useContabilidadDerivada.
   ============================================================ */
function VentasClientesSub({ clientes, setClientes, facturasVenta }) {
  const vacio = { nombre: "", contacto: "", email: "", telefono: "", notas: "" };
  const [form, setForm] = useState(vacio);
  const [editId, setEditId] = useState(null);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const guardar = () => {
    if (!form.nombre.trim()) return;
    if (editId) {
      aplicarAccion(setClientes, editId, "editar", { ...form, nombre: form.nombre.trim() }, "Datos del cliente actualizados");
      setEditId(null);
    } else {
      setClientes((prev) => [crearRegistro({ ...form, nombre: form.nombre.trim() }, `Cliente "${form.nombre.trim()}" dado de alta`), ...prev]);
    }
    setForm(vacio);
  };
  const editar = (c) => { setEditId(c.id); setForm({ nombre: c.nombre, contacto: c.contacto, email: c.email, telefono: c.telefono, notas: c.notas }); };

  const facturadoPorCliente = {};
  facturasVenta.forEach((f) => { if (f.estado === "activo") facturadoPorCliente[f.cliente] = (facturadoPorCliente[f.cliente] || 0) + f.total; });
  const activos = clientes.filter((c) => c.estado === "activo");
  const topCliente = Object.entries(facturadoPorCliente).sort((a, b) => b[1] - a[1])[0] || null;
  const haceUnMes = Date.now() - 30 * 86400000;
  const nuevos = activos.filter((c) => new Date(c.fechaCreacion).getTime() > haceUnMes).length;

  return (
    <div className="space-y-4">
      <DashboardKpis title="Cartera de clientes" items={[
        { label: "Clientes activos", value: activos.length, Icon: Users },
        { label: "Nuevos (30 días)", value: nuevos, Icon: UserPlus },
        { label: "Mejor cliente (facturado)", value: topCliente ? topCliente[0] : "—", Icon: DollarSign, hint: topCliente ? fmtMoney2(topCliente[1]) : "sin datos", tone: "dark" },
        { label: "Cancelados / eliminados", value: clientes.length - activos.length, Icon: Ban },
      ]} />

      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3 flex items-center gap-2">
          <UserPlus className="w-4 h-4" /> {editId ? "Editar cliente" : "Alta de cliente"}
        </h3>
        <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
          <label className="flex flex-col gap-1.5 md:col-span-2">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Nombre / razón social</span>
            <input value={form.nombre} onChange={(e) => set("nombre", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Contacto</span>
            <input value={form.contacto} onChange={(e) => set("contacto", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Teléfono</span>
            <input value={form.telefono} onChange={(e) => set("telefono", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5 md:col-span-2">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Email</span>
            <input value={form.email} onChange={(e) => set("email", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
          <label className="flex flex-col gap-1.5 md:col-span-2">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Notas</span>
            <input value={form.notas} onChange={(e) => set("notas", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
        </div>
        <div className="mt-3 flex gap-2">
          <button onClick={guardar} disabled={!form.nombre.trim()} className="px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition flex items-center gap-1.5 disabled:opacity-40">
            <Plus className="w-4 h-4" /> {editId ? "Guardar cambios" : "Dar de alta"}
          </button>
          {editId && <button onClick={() => { setEditId(null); setForm(vacio); }} className="px-4 py-2.5 rounded-xl border border-zinc-200 text-[12px] font-medium">Cancelar edición</button>}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-200 bg-zinc-50/50">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase">Clientes registrados</h3>
        </div>
        {clientes.length === 0 && <div className="p-6 text-center text-[13px] text-zinc-500">Sin clientes todavía.</div>}
        {clientes.map((c) => (
          <div key={c.id} className="px-4 py-2.5 border-b border-zinc-100 flex items-center justify-between text-[12px] gap-3">
            <div className="min-w-0">
              <div className="font-medium truncate">{c.nombre}</div>
              <div className="text-[11px] text-zinc-500 truncate">{c.contacto}{c.telefono ? " · " + c.telefono : ""}{c.email ? " · " + c.email : ""} · alta {fmtFecha(c.fechaCreacion)}</div>
            </div>
            <AccionesRegistro
              registro={c}
              onEditar={() => editar(c)}
              onCancelar={() => aplicarAccion(setClientes, c.id, "cancelar", null, `Cliente "${c.nombre}" marcado inactivo`)}
              onBorrar={() => aplicarAccion(setClientes, c.id, "borrar", null, `Cliente "${c.nombre}" eliminado`)}
              onRestaurar={() => aplicarAccion(setClientes, c.id, "restaurar", null, `Cliente "${c.nombre}" restaurado`)}
            />
          </div>
        ))}
      </div>
    </div>
  );
}

const COTIZACION_ESTADOS_COLOR = {
  Enviada: "bg-blue-50 border-blue-200 text-blue-700",
  Aceptada: "bg-emerald-50 border-emerald-200 text-emerald-700",
  Rechazada: "bg-red-50 border-red-200 text-red-700",
};

function VentasCotizacionesSub({ productos, stats, clientes, cotizaciones, setCotizaciones, crearPedidoDesdeCotizacion }) {
  const clientesActivos = clientes.filter((c) => c.estado === "activo");
  const vacio = { cliente: "", productoId: "", cantidad: 1, descuentoPct: 0, vendedor: "" };
  const [form, setForm] = useState(vacio);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const precioUnitario = stats.precioConIVA;
  const subtotal = precioUnitario * (Number(form.cantidad) || 0);
  const descuento = subtotal * ((Number(form.descuentoPct) || 0) / 100);
  const total = subtotal - descuento;
  const productoNombre = productos.find((p) => p.id === form.productoId)?.nombre || "";

  const activas = cotizaciones.filter((c) => c.estado === "activo");
  const pendientes = activas.filter((c) => c.estadoComercial === "Enviada");
  const aceptadas = activas.filter((c) => c.estadoComercial === "Aceptada");
  const totalCotizado = activas.reduce((s, c) => s + c.total, 0);
  const tasaConversion = activas.length ? (aceptadas.length / activas.length) * 100 : 0;

  const agregar = () => {
    if (!form.cliente.trim()) return;
    setCotizaciones((prev) => [crearRegistro({
      cliente: form.cliente.trim(), productoId: form.productoId, productoNombre,
      cantidad: Number(form.cantidad) || 0, precioUnitario, descuentoPct: Number(form.descuentoPct) || 0,
      total, vendedor: form.vendedor.trim(), fecha: new Date().toISOString(), estadoComercial: "Enviada",
    }, `Cotización enviada a ${form.cliente.trim()}`), ...prev]);
    setForm(vacio);
  };

  const aceptar = (c) => {
    aplicarAccion(setCotizaciones, c.id, "editar", { estadoComercial: "Aceptada" }, "Cotización aceptada por el cliente");
    crearPedidoDesdeCotizacion(c);
  };
  const rechazar = (c) => aplicarAccion(setCotizaciones, c.id, "editar", { estadoComercial: "Rechazada" }, "Cotización rechazada por el cliente");

  const bandeja = pendientes.map((c) => ({ key: c.id, concepto: `Cotización — ${c.cliente}${c.productoNombre ? " · " + c.productoNombre : ""}`, contraparte: c.cliente, monto: c.total, origen: "Ventas" }));

  return (
    <div className="space-y-4">
      <DashboardKpis title="Cotizaciones" items={[
        { label: "Activas", value: activas.length, Icon: FileText },
        { label: "Esperando respuesta", value: pendientes.length, Icon: Clock, tone: pendientes.length ? "warn" : undefined },
        { label: "Total cotizado", value: fmtMoney2(totalCotizado), Icon: DollarSign },
        { label: "Tasa de conversión", value: `${fmtNum(tasaConversion)}%`, Icon: TrendingUp, tone: "dark" },
      ]} />

      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Bandeja de entrada — esperando respuesta del cliente</h3>
        <BandejaEntrada items={bandeja} tono="blue" vacio="Sin cotizaciones pendientes de respuesta." />
        {pendientes.length > 0 && (
          <div className="mt-2 space-y-1.5">
            {pendientes.map((c) => (
              <div key={c.id} className="flex items-center justify-between gap-2 text-[11px] text-zinc-500">
                <span className="truncate">{c.cliente}</span>
                <div className="flex gap-2 shrink-0">
                  <button onClick={() => aceptar(c)} className="px-3 py-1 rounded-lg bg-emerald-600 text-white text-[11px] font-medium hover:bg-emerald-700">Aceptar → crear pedido</button>
                  <button onClick={() => rechazar(c)} className="px-3 py-1 rounded-lg border border-zinc-200 text-[11px] font-medium hover:bg-zinc-50">Rechazar</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3 flex items-center gap-2">
          <DollarSign className="w-4 h-4" /> Nueva cotización — usa el precio ya calculado en Costeos
        </h3>
        <div className="grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
          <label className="flex flex-col gap-1.5 md:col-span-2">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Cliente</span>
            <input list="lista-clientes-cotiz" value={form.cliente} onChange={(e) => set("cliente", e.target.value)} placeholder="Nombre del cliente" className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
            <datalist id="lista-clientes-cotiz">{clientesActivos.map((c) => <option key={c.id} value={c.nombre} />)}</datalist>
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Producto</span>
            <select value={form.productoId} onChange={(e) => set("productoId", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900">
              <option value="">— General —</option>
              {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
            </select>
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Cantidad</span>
            <input type="number" step="1" value={form.cantidad} onChange={(e) => set("cantidad", Number(e.target.value))} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Descuento %</span>
            <input type="number" step="1" value={form.descuentoPct} onChange={(e) => set("descuentoPct", Number(e.target.value))} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900 mono" />
          </label>
          <label className="flex flex-col gap-1.5">
            <span className="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Vendedor (opcional)</span>
            <input value={form.vendedor} onChange={(e) => set("vendedor", e.target.value)} className="bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-zinc-900" />
          </label>
        </div>
        <div className="mt-3 flex items-center justify-between rounded-xl bg-zinc-900 text-white px-4 py-3">
          <span className="text-[12px] text-zinc-300">Precio unitario {fmtMoney2(precioUnitario)} × {fmtNum(form.cantidad)} − {fmtNum(form.descuentoPct)}%</span>
          <span className="text-lg font-semibold mono">{fmtMoney2(total)}</span>
        </div>
        <button onClick={agregar} disabled={!form.cliente.trim()} className="mt-3 px-4 py-2.5 rounded-xl bg-zinc-900 text-white text-[12px] font-medium hover:bg-black transition flex items-center gap-1.5 disabled:opacity-40">
          <Plus className="w-4 h-4" /> Enviar cotización
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-200 bg-zinc-50/50 flex items-center justify-between">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase">Todas las cotizaciones</h3>
          <span className="text-[11px] text-zinc-500">{cotizaciones.length} registradas</span>
        </div>
        {cotizaciones.length === 0 && <div className="p-6 text-center text-[13px] text-zinc-500">Sin cotizaciones todavía.</div>}
        {cotizaciones.map((c) => (
          <div key={c.id} className="px-4 py-2.5 border-b border-zinc-100 flex items-center justify-between text-[12px] gap-3">
            <div className="min-w-0">
              <div className="font-medium truncate flex items-center gap-1.5">
                {c.cliente} {c.productoNombre && <span className="text-[10px] px-2 py-0.5 rounded-full bg-zinc-100 border border-zinc-200">{c.productoNombre}</span>}
                <span className={`text-[10px] px-2 py-0.5 rounded-full border font-medium ${COTIZACION_ESTADOS_COLOR[c.estadoComercial] || "bg-zinc-100 border-zinc-200"}`}>{c.estadoComercial}</span>
              </div>
              <div className="text-[11px] text-zinc-500">{fmtNum(c.cantidad)} uds × {fmtMoney2(c.precioUnitario)} · {fmtFecha(c.fecha)}{c.vendedor ? " · vendedor: " + c.vendedor : ""}</div>
            </div>
            <div className="flex items-center gap-2">
              <span className="mono font-semibold">{fmtMoney2(c.total)}</span>
              <AccionesRegistro
                registro={c}
                onCancelar={() => aplicarAccion(setCotizaciones, c.id, "cancelar", null, "Cotización cancelada")}
                onBorrar={() => aplicarAccion(setCotizaciones, c.id, "borrar", null, "Cotización eliminada")}
                onRestaurar={() => aplicarAccion(setCotizaciones, c.id, "restaurar", null, "Cotización restaurada")}
              />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const PEDIDO_ESTADOS_COLOR = {
  Pendiente: "bg-amber-50 border-amber-200 text-amber-700",
  "En proceso": "bg-blue-50 border-blue-200 text-blue-700",
  Entregado: "bg-emerald-50 border-emerald-200 text-emerald-700",
};

function VentasPedidosSub({ pedidosVenta, setPedidosVenta, marcarPedidoEntregado }) {
  const activos = pedidosVenta.filter((p) => p.estado === "activo");
  const pendientes = activos.filter((p) => p.estadoComercial !== "Entregado");
  const totalEnProceso = pendientes.reduce((s, p) => s + p.total, 0);
  const entregados = activos.filter((p) => p.estadoComercial === "Entregado");

  const bandeja = pendientes.map((p) => ({ key: p.id, concepto: `Pedido — ${p.cliente}${p.productoNombre ? " · " + p.productoNombre : ""}`, contraparte: p.cliente, monto: p.total, origen: "Cotizaciones" }));

  const avanzar = (p) => {
    if (p.estadoComercial === "Pendiente") aplicarAccion(setPedidosVenta, p.id, "editar", { estadoComercial: "En proceso" }, "Pedido pasó a proceso de surtido");
    else if (p.estadoComercial === "En proceso") marcarPedidoEntregado(p);
  };

  return (
    <div className="space-y-4">
      <DashboardKpis title="Pedidos" items={[
        { label: "Pedidos activos", value: activos.length, Icon: Boxes },
        { label: "Pendientes de entregar", value: pendientes.length, Icon: Clock, tone: pendientes.length ? "warn" : undefined },
        { label: "Valor en proceso", value: fmtMoney2(totalEnProceso), Icon: DollarSign },
        { label: "Entregados", value: entregados.length, Icon: Truck, tone: "dark" },
      ]} />

      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Bandeja de entrada — pedidos por surtir/entregar</h3>
        <BandejaEntrada items={bandeja} tono="amber" vacio="Sin pedidos pendientes." />
      </div>

      <div className="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-200 bg-zinc-50/50 flex items-center justify-between">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase">Pedidos (generados desde Cotizaciones aceptadas)</h3>
          <span className="text-[11px] text-zinc-500">{pedidosVenta.length} registrados</span>
        </div>
        {pedidosVenta.length === 0 && <div className="p-6 text-center text-[13px] text-zinc-500">Sin pedidos todavía. Se crean automáticamente al aceptar una cotización.</div>}
        {pedidosVenta.map((p) => (
          <div key={p.id} className="px-4 py-2.5 border-b border-zinc-100 flex items-center justify-between text-[12px] gap-3">
            <div className="min-w-0">
              <div className="font-medium truncate flex items-center gap-1.5">
                {p.cliente} {p.productoNombre && <span className="text-[10px] px-2 py-0.5 rounded-full bg-zinc-100 border border-zinc-200">{p.productoNombre}</span>}
                <span className={`text-[10px] px-2 py-0.5 rounded-full border font-medium ${PEDIDO_ESTADOS_COLOR[p.estadoComercial] || "bg-zinc-100 border-zinc-200"}`}>{p.estadoComercial}</span>
              </div>
              <div className="text-[11px] text-zinc-500">creado {fmtFecha(p.fechaCreacion)} · desde cotización #{p.cotizacionId ? p.cotizacionId.slice(0, 6) : "—"}</div>
            </div>
            <div className="flex items-center gap-2">
              <span className="mono font-semibold">{fmtMoney2(p.total)}</span>
              {p.estado === "activo" && p.estadoComercial !== "Entregado" && (
                <button onClick={() => avanzar(p)} className="px-3 py-1 rounded-lg bg-zinc-900 text-white text-[11px] font-medium hover:bg-black">
                  {p.estadoComercial === "Pendiente" ? "Iniciar proceso" : "Marcar entregado → facturar"}
                </button>
              )}
              <AccionesRegistro
                registro={p}
                onCancelar={() => aplicarAccion(setPedidosVenta, p.id, "cancelar", null, "Pedido cancelado")}
                onBorrar={() => aplicarAccion(setPedidosVenta, p.id, "borrar", null, "Pedido eliminado")}
                onRestaurar={() => aplicarAccion(setPedidosVenta, p.id, "restaurar", null, "Pedido restaurado")}
              />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const FACTURA_ESTADOS_COLOR = {
  Emitida: "bg-blue-50 border-blue-200 text-blue-700",
  Cobrada: "bg-emerald-50 border-emerald-200 text-emerald-700",
};

function VentasFacturasSub({ facturasVenta, setFacturasVenta, notasCredito, marcarFacturaCobrada }) {
  const activas = facturasVenta.filter((f) => f.estado === "activo");
  const notaPorFactura = (facturaId) => notasCredito.filter((n) => n.facturaId === facturaId && n.estado === "activo").reduce((s, n) => s + n.monto, 0);
  const pendientesCobro = activas.filter((f) => f.estadoComercial === "Emitida");
  const totalPorCobrar = pendientesCobro.reduce((s, f) => s + (f.total - notaPorFactura(f.id)), 0);
  const totalCobrado = activas.filter((f) => f.estadoComercial === "Cobrada").reduce((s, f) => s + (f.total - notaPorFactura(f.id)), 0);

  const bandeja = pendientesCobro.map((f) => ({ key: f.id, concepto: `Factura — ${f.cliente}`, contraparte: f.cliente, monto: f.total - notaPorFactura(f.id), origen: "Pedidos" }));

  return (
    <div className="space-y-4">
      <DashboardKpis title="Facturación" items={[
        { label: "Facturas activas", value: activas.length, Icon: FileText },
        { label: "Por cobrar", value: fmtMoney2(totalPorCobrar), Icon: Clock, tone: pendientesCobro.length ? "warn" : undefined },
        { label: "Cobrado", value: fmtMoney2(totalCobrado), Icon: DollarSign },
        { label: "Notas de crédito activas", value: notasCredito.filter((n) => n.estado === "activo").length, Icon: TriangleAlert, tone: "dark" },
      ]} />

      <div className="bg-white rounded-2xl border border-zinc-200 p-4">
        <h3 className="text-[12px] font-semibold tracking-widest uppercase text-zinc-500 mb-3">Bandeja de entrada — facturas por cobrar</h3>
        <BandejaEntrada items={bandeja} accionLabel="Registrar cobro" onAccion={(it) => marcarFacturaCobrada(facturasVenta.find((f) => f.id === it.key))} vacio="Sin facturas pendientes de cobro." />
        <div className="mt-2 text-[11px] text-zinc-500">Estas mismas facturas alimentan Cuentas por Cobrar en Contabilidad, en cascada.</div>
      </div>

      <div className="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-200 bg-zinc-50/50 flex items-center justify-between">
          <h3 className="text-[12px] font-semibold tracking-widest uppercase">Facturas (generadas desde Pedidos entregados)</h3>
          <span className="text-[11px] text-zinc-500">{facturasVenta.length} registradas</span>
        </div>
        {facturasVenta.length === 0 && <div className="p-6 text-center text-[13px] text-zinc-500">Sin facturas todavía. Se generan automáticamente al marcar un pedido como entregado.</div>}
        {facturasVenta.map((f) => (
          <div key={f.id} className="px-4 py-2.5 border-b border-zinc-100 flex items-center justify-between text-[12px] gap-3">
            <div className="min-w-0">
              <div className="font-medium truncate flex items-center gap-1.5">
                {f.cliente}
                <span className={`text-[10px] px-2 py-0.5 rounded-full border font-medium ${FACTURA_ESTADOS_COLOR[f.estadoComercial] || "bg-zinc-100 border-zinc-200"}`}>{f.estadoComercial}</span>
              </div>
              <div className="text-[11px] text-zinc-500">emitida {fmtFecha(f.fechaCreacion)}{notaPorFactura(f.id) > 0 ? ` · con nota de crédito de ${fmtMoney2(notaPorFactura(f.id))}` : ""}</div>
            </div>
            <div className="flex items-center gap-2">
              <span className="mono font-semibold">{fmtMoney2(f.total - notaPorFactura(f.id))}</span>
              {f.estado === "activo" && f.estadoComercial === "Emitida" && (
                <button onClick={() => marcarFacturaCobrada(f)} className="px-3 py-1 rounded-lg bg-zinc-900 text-white text-[11px] font-medium hover:bg-black">Registrar cobro</button>
              )}
              <AccionesRegistro
                registro={f}
                onCancelar={() => aplicarAccion(setFacturasVenta, f.id, "cancelar", null, "Factura cancelada — se retira de Cuentas por Cobrar")}
                onBorrar={() => aplicarAccion(setFacturasVenta, f.id, "borrar", null, "Factura eliminada")}
                onRestaurar={() => aplicarAccion(setFacturasVenta, f.id, "restaurar", null, "Factura restaurada")}
              />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function VentasNotasCreditoSub({ facturasVenta, notasCredito, setNotasCredito }) {
  const facturables = facturasVenta.filter((f) => f.estado === "activo");
  const vacio = { facturaId: "", monto: 0, motivo: "" };
  const [form, setForm] = useState(vacio);

  const activas = notasCredito.filter((n) => n.estado === "activo");

  const agregar = () => {
    if (!form.facturaId || !Number(form.monto)) return;
    setNotasCredito((prev) => [crearRegistro({
      facturaId: form.facturaId, cliente: facturaSel?.cliente || "", monto: Number(form.monto),
      motivo: form.motivo.trim(), fecha: new Date().toISOString(),
    }, `Nota de crédito por ${fmtMoney2(Number(form.monto))} sobre factura de ${facturaSel?.cliente || ""}`), ...prev]);
