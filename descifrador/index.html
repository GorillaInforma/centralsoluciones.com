<style>
  :root{
    --bg:#ffffff;
    --panel:#fafafa;
    --panel-2:#f2f3f5;
    --line:#e0e2e6;
    --text:#1c1f24;
    --dim:#6b7280;
    --accent:#1a56db;
    --accent-soft:#e8eefc;
    --bad:#c0392b;
    --good:#1f8a55;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:40px 20px 60px;
    line-height:1.55;
  }
  .wrap{max-width:960px;margin:0 auto;}
  h1{
    font-size:1.4rem;
    margin:0 0 26px;
    color:var(--text);
    font-weight:600;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:14px;
  }
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  label{
    display:block;
    font-size:.82rem;
    color:var(--dim);
    margin-bottom:6px;
  }
  input[type=number], input[type=text], textarea{
    width:100%;
    background:#ffffff;
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    padding:10px 12px;
    border-radius:6px;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--accent);
  }
  textarea{resize:vertical;min-height:70px;grid-column:1/-1;}
  .field-full{grid-column:1/-1;}
  button{
    background:var(--accent);
    color:#ffffff;
    border:none;
    font-family:var(--sans);
    font-weight:600;
    font-size:.9rem;
    padding:11px 20px;
    border-radius:6px;
    cursor:pointer;
  }
  button:hover{filter:brightness(1.08);}
  button:disabled{background:#c6ccd6;cursor:not-allowed;}
  button.secondary{
    background:#ffffff;
    color:var(--accent);
    border:1px solid var(--accent);
  }
  button.secondary:hover{background:var(--accent-soft);}
  .btn-row{display:flex;gap:10px;margin:16px 0 28px;flex-wrap:wrap;align-items:center;}
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px 22px;
    margin-bottom:20px;
  }
  .panel h2{
    font-size:.95rem;
    color:var(--text);
    margin:0 0 14px;
    font-weight:600;
  }
  .stats{display:flex;gap:26px;flex-wrap:wrap;font-size:.9rem;}
  .stat b{display:block;font-size:1.3rem;color:var(--text);font-weight:600;}
  .stat span.lbl{color:var(--dim);font-size:.8rem;}
  .ok{color:var(--good);}
  .warn{color:var(--bad);}
  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th,td{
    text-align:left;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  th{color:var(--dim);font-weight:600;font-size:.8rem;}
  td.code{color:var(--accent);font-weight:600;}
  td.freq{color:var(--dim);}
  select{
    width:100%;
    background:#ffffff;
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    padding:7px 9px;
    border-radius:6px;
  }
  .output{
    font-size:1.2rem;
    letter-spacing:.02em;
    word-break:break-all;
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px;
    min-height:50px;
  }
  .output .missing{color:var(--dim);}
  .seq-view{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:16px;
  }
  .chip{
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:4px 8px;
    font-size:.78rem;
    color:var(--dim);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip b{color:var(--accent);font-weight:600;}
  .msg{font-size:.85rem;margin-top:8px;}
  .check-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:6px;}
  .check-item{display:flex;align-items:center;gap:7px;font-size:.88rem;color:var(--text);}
  .check-item input{width:auto;}
  .gen-summary{font-size:.88rem;margin:10px 0 16px;}
  .gen-summary b{color:var(--text);}
  .resultTable td{font-size:.95rem;}
  .resultTable td.idx{color:var(--dim);width:60px;}
  .scroll-list{max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;}
  .scroll-list table{margin:0;}
</style>

<script>
const LETRAS = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
const NUMEROS = '0123456789'.split('');
const SIMBOLOS = ['-','!','@','#','$','%','^','&','*','(',')',"'",'"',':',';',',','?','.'];
const ESPACIO = [' '];

// ==== Orden por "coherencia en español" ====
// Heurística simple, sin diccionario: premia la alternancia consonante-vocal
// (que es como suenan la mayoría de palabras en español) y castiga las rachas
// largas de consonantes seguidas (poco naturales en español).
const VOCALES_ES = new Set(['A','E','I','O','U','Á','É','Í','Ó','Ú','Ü']);
let ordenResultados = 'orden'; // 'orden' = como se generó (A-Z) | 'coherencia' = heurística de español

function tipoCaracter(ch){
  const c = ch.toUpperCase();
  if (VOCALES_ES.has(c)) return 'vocal';
  if (c >= 'A' && c <= 'Z' || c === 'Ñ') return 'consonante';
  return 'otro'; // dígitos, símbolos, espacio: no cuentan como racha ni como par
}

function puntajeCoherencia(palabra){
  let pares = 0;
  let penalizacion = 0;
  let racha = 0;
  let anterior = null;
  for (let i = 0; i < palabra.length; i++){
    const tipo = tipoCaracter(palabra[i]);
    if (tipo === 'consonante'){
      racha++;
    } else {
      if (racha > 1) penalizacion += (racha - 1) * (racha - 1);
      racha = 0;
    }
    if (anterior && ((anterior === 'consonante' && tipo === 'vocal') || (anterior === 'vocal' && tipo === 'consonante'))){
      pares++;
    }
    anterior = tipo;
  }
  if (racha > 1) penalizacion += (racha - 1) * (racha - 1);
  return pares - penalizacion;
}

function ordenarLista(lista){
  if (ordenResultados !== 'coherencia') return lista;
  return lista
    .map((palabra, i) => ({palabra, i, puntaje: puntajeCoherencia(palabra)}))
    .sort((a, b) => (b.puntaje - a.puntaje) || (a.i - b.i))
    .map(x => x.palabra);
}

function cambiarOrden(valor){
  ordenResultados = valor;
  const selGen = document.getElementById('inOrdenGen');
  const selHist = document.getElementById('inOrdenHistorial');
  if (selGen) selGen.value = valor;
  if (selHist) selHist.value = valor;
  guardarParametrosLocales();
  renderGenList();
  if (historialLoteActual) renderHistorialVista();
}

const FREQ_ES = ['E','A','O','S','R','N','I','D','L','C','T','U','M','P','B','G','Y','V','Q','H','F','Z','J','Ñ','X','W','K',' ','-'];
const FREQ_EN = ['E','T','A','O','I','N','S','H','R','D','L','C','U','M','W','F','G','Y','P','B','V','K','J','X','Q','Z',' ','-'];

const DISPLAY_LIMIT = 5000; // tope de resultados por lote (además del tope por tamaño en bytes)
const TICK_SIZE = 500;      // cuántos se procesan por ciclo, para no congelar la pestaña
const FIRESTORE_BATCH_BYTES_LIMIT = 700000; // margen seguro bajo el límite real de Firestore (1 MB por documento)

// ==== Firebase ====
// TODO Rober: pega aquí tu firebaseConfig real (Firebase Console → Configuración del proyecto → tus apps).
const firebaseConfig = {
  apiKey: "AIzaSyD81dl69HPmmYPIl91sYdMMn8u4QNFtQTc",
  authDomain: "bits-e1513.firebaseapp.com",
  projectId: "bits-e1513",
  storageBucket: "bits-e1513.firebasestorage.app",
  messagingSenderId: "764437047845",
  appId: "1:764437047845:web:5afb718f1038f370646dcc"
};
let db = null;
let firebaseListo = false;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebaseListo = true;
} catch (e) {
  console.warn('Firebase no se pudo inicializar. Revisa firebaseConfig.', e);
}

const COLECCION_LOTES = 'lotes_generados';
const COLECCION_PROGRESO = 'progreso_firmas'; // 1 documento por firma, para no regenerar/duplicar lo ya hecho
let genSessionId = null;   // agrupa todos los lotes de una misma corrida de generación
let genLoteActual = 0;     // número de lote dentro de la corrida
let genLotesGuardados = 0; // lotes ya confirmados en Firestore
let genGuardando = false;  // evita solapar escrituras a Firestore
let genEstadoMsg = '';     // último mensaje de estado del guardado
let genBytesEstimados = 0; // tamaño aproximado (en bytes) del lote actual, antes de guardarlo
let genFirmaId = null;     // hash de la firma actual, usado como ID de documento en progreso_firmas
let genPool = null;        // conjunto de caracteres disponible para la corrida actual

let state = {
  codes: [],
  unique: [],
  freq: {},
  assign: {}
};

let genResults = []; // buffer del lote actual (solo para controlar tamaño al guardar en Firestore)
let genDisplayResults = []; // TODO lo generado hasta ahora, de la palabra 1 a la última (lo que se muestra en pantalla)
let genTotalTheoretical = null;
let genGenerator = null;
let genContext = null;
let genSignature = null;
let genCumulativeCount = 0;
let genDone = false;
let genRunToken = 0;
let ultimaFirmaProcesada = null; // detecta cuándo un cambio de parámetros produce un lote realmente distinto

function factorialPerm(n, r){
  if (r > n) return null;
  let result = 1n;
  for (let i = 0; i < r; i++) result *= BigInt(n - i);
  return result.toString();
}

function formatBigNumber(str){
  if (str.length > 21){
    const exp = str.length - 1;
    const mantissa = str[0] + '.' + str.slice(1, 4);
    return mantissa + ' × 10^' + exp;
  }
  return str.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function analizar(){
  const bitsVal = parseInt(document.getElementById('inBits').value, 10);
  const uniqueVal = parseInt(document.getElementById('inUnique').value, 10);
  const totalVal = parseInt(document.getElementById('inTotal').value, 10);
  const rawBin = document.getElementById('inBin').value.replace(/[^01]/g, '');
  const valBox = document.getElementById('validation');
  valBox.innerHTML = '';

  if (!bitsVal || bitsVal < 1){
    valBox.innerHTML = '<div class="msg warn">Indica cuántos bits tiene cada código.</div>';
    return;
  }
  if (!rawBin){
    valBox.innerHTML = '<div class="msg warn">Pega la cadena binaria a analizar.</div>';
    return;
  }
  if (rawBin.length % bitsVal !== 0){
    valBox.innerHTML = `<div class="msg warn">La cadena tiene ${rawBin.length} bits, que no es múltiplo de ${bitsVal}. Revisa la cadena o el tamaño de código.</div>`;
    return;
  }

  const codes = [];
  for (let i = 0; i < rawBin.length; i += bitsVal){
    codes.push(rawBin.slice(i, i + bitsVal));
  }

  const freq = {};
  const uniqueOrdered = [];
  codes.forEach(c => {
    if (!(c in freq)){ freq[c] = 0; uniqueOrdered.push(c); }
    freq[c]++;
  });

  state.codes = codes;
  state.unique = uniqueOrdered;
  state.freq = freq;
  const newAssign = {};
  uniqueOrdered.forEach(c => { newAssign[c] = state.assign[c] || ''; });
  state.assign = newAssign;

  let msgs = [];
  if (totalVal && totalVal !== codes.length){
    msgs.push(`<span class="warn">Esperabas ${totalVal} símbolos en total, pero la cadena produce ${codes.length}.</span>`);
  } else if (totalVal){
    msgs.push(`<span class="ok">Total de símbolos coincide (${codes.length}).</span>`);
  }
  if (uniqueVal && uniqueVal !== uniqueOrdered.length){
    msgs.push(`<span class="warn">Esperabas ${uniqueVal} combinaciones únicas, pero se encontraron ${uniqueOrdered.length}.</span>`);
  } else if (uniqueVal){
    msgs.push(`<span class="ok">Combinaciones únicas coinciden (${uniqueOrdered.length}).</span>`);
  }
  valBox.innerHTML = msgs.map(m => `<div class="msg">${m}</div>`).join('');

  renderStats(bitsVal, codes.length, uniqueOrdered.length);
  renderTable();
  renderOutput();
  document.getElementById('panelGen').style.display = 'block';
  restartGeneration();
}

function renderStats(bits, total, uniqueCount){
  document.getElementById('panelStats').style.display = 'block';
  const maxPossible = Math.pow(2, bits);
  document.getElementById('statsBox').innerHTML = `
    <div class="stat"><b>${total}</b><span class="lbl">símbolos totales</span></div>
    <div class="stat"><b>${uniqueCount}</b><span class="lbl">códigos únicos</span></div>
    <div class="stat"><b>${bits}</b><span class="lbl">bits por código</span></div>
    <div class="stat"><b>${maxPossible}</b><span class="lbl">combinaciones posibles</span></div>
    <div class="stat"><b>${maxPossible - uniqueCount}</b><span class="lbl">códigos sin usar</span></div>
  `;
}

function renderTable(){
  // Sección de "Asignación manual (opcional)" eliminada; función queda sin efecto.
}

function renderOutput(){
  // Sección de "Resultado con la asignación manual" eliminada; función queda sin efecto.
}

function limpiarAsignaciones(){
  state.unique.forEach(c => state.assign[c] = '');
  renderTable();
  renderOutput();
  restartGeneration();
}

function activeCharset(){
  let chars = [];
  if (document.getElementById('chkLetras').checked) chars = chars.concat(LETRAS);
  if (document.getElementById('chkNumeros').checked) chars = chars.concat(NUMEROS);
  if (document.getElementById('chkSimbolos').checked) chars = chars.concat(SIMBOLOS);
  if (document.getElementById('chkEspacio').checked) chars = chars.concat(ESPACIO);
  return chars;
}

function computeSignature(){
  const assignedCodes = state.unique.filter(c => state.assign[c]);
  const usedSymbols = assignedCodes.map(c => state.assign[c]).sort().join(',');
  const chk = ['chkLetras','chkNumeros','chkSimbolos','chkEspacio'].map(id => document.getElementById(id).checked).join(',');
  return state.unique.join(',') + '|' + usedSymbols + '|' + chk;
}

function hashFirma(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return 'firma_' + (h >>> 0).toString(16);
}

function updateGenSummary(){
  if (!state.unique.length) return;
  const assignedCodes = state.unique.filter(c => state.assign[c]);
  const unassignedCodes = state.unique.filter(c => !state.assign[c]);
  const usedSymbols = new Set(assignedCodes.map(c => state.assign[c]));
  const pool = activeCharset().filter(ch => !usedSymbols.has(ch));

  const r = unassignedCodes.length;
  const n = pool.length;
  const summary = document.getElementById('genSummary');

  if (r === 0){
    summary.innerHTML = 'Todos los códigos ya tienen símbolo asignado manualmente. Revisa el resultado arriba.';
    return null;
  }
  if (n < r){
    summary.innerHTML = `<span class="warn">El conjunto de caracteres seleccionado (${n}) es menor que los códigos sin asignar (${r}). Marca más categorías.</span>`;
    return null;
  }

  const total = factorialPerm(n, r);
  genTotalTheoretical = total;

  summary.innerHTML = `
    Códigos fijados manualmente: <b>${assignedCodes.length}</b> ·
    Códigos por resolver: <b>${r}</b> ·
    Caracteres disponibles: <b>${n}</b> ·
    Combinaciones posibles en total: <b>${formatBigNumber(total)}</b>
  `;
  return {assignedCodes, unassignedCodes, pool};
}

['chkLetras','chkNumeros','chkSimbolos','chkEspacio'].forEach(id => {
  document.getElementById(id).addEventListener('change', restartGeneration);
});

function* permute(arr, r, used, current){
  if (current.length === r){
    yield current.slice();
    return;
  }
  for (let i = 0; i < arr.length; i++){
    if (used[i]) continue;
    used[i] = true;
    current.push(arr[i]);
    yield* permute(arr, r, used, current);
    current.pop();
    used[i] = false;
  }
}

function restartGeneration(){
  genRunToken++;
  const token = genRunToken;

  genGenerator = null;
  genContext = null;
  genSignature = null;
  genFirmaId = null;
  genPool = null;
  genCumulativeCount = 0;
  genDone = false;
  genResults = [];
  genDisplayResults = [];
  genLoteActual = 0;
  genLotesGuardados = 0;
  genGuardando = false;
  genEstadoMsg = '';
  genBytesEstimados = 0;
  genSessionId = 'sesion_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  document.getElementById('genResults').innerHTML = '';
  document.getElementById('genProgress').innerHTML = '';
  document.getElementById('btnDownloadAll').style.display = 'none';
  document.getElementById('btnClear').style.display = 'none';

  const ctx = updateGenSummary();
  if (!ctx) return;

  genContext = {assignedCodes: ctx.assignedCodes, unassignedCodes: ctx.unassignedCodes};
  genPool = ctx.pool;
  genSignature = computeSignature();
  genFirmaId = hashFirma(genSignature);

  if (genFirmaId !== ultimaFirmaProcesada){
    ultimaFirmaProcesada = genFirmaId;
    // Antes aquí se llamaba a limpiarLotesAntiguos(), que borraba todos los lotes
    // guardados en Firestore excepto los 3 más recientes (de CUALQUIER firma).
    // Eso hacía imposible reconstruir el total completo generado. Ya no se borra
    // nada automáticamente; limpiarLotesAntiguos() queda disponible para borrado manual.
  }

  if (!firebaseListo || !db){
    iniciarGeneradorDesdeCero(token);
    return;
  }

  db.collection(COLECCION_PROGRESO).doc(genFirmaId).get().then(snap => {
    if (token !== genRunToken) return;
    if (snap.exists && snap.data().firma === genSignature){
      const p = snap.data();
      if (p.completo){
        mostrarComoYaCompleto(token, p);
      } else {
        reanudarDesde(token, p.ultimoFin || 0, p.ultimoLote || 0);
      }
    } else {
      iniciarGeneradorDesdeCero(token);
    }
  }).catch(err => {
    console.warn('No se pudo revisar progreso previo en Firebase', err);
    if (token !== genRunToken) return;
    iniciarGeneradorDesdeCero(token);
  });
}

function limpiarLotesAntiguos(){
  if (!firebaseListo || !db) return;
  db.collection(COLECCION_LOTES).orderBy('creado', 'desc').get().then(snapshot => {
    const docs = snapshot.docs;
    if (docs.length <= 3) return;
    const aBorrar = docs.slice(3);
    const batch = db.batch();
    aBorrar.forEach(doc => batch.delete(doc.ref));
    return batch.commit();
  }).catch(err => {
    console.warn('No se pudo limpiar lotes antiguos en Firebase', err);
  });
}

function iniciarGeneradorDesdeCero(token){
  if (token !== genRunToken) return;
  const used = new Array(genPool.length).fill(false);
  genGenerator = permute(genPool, genContext.unassignedCodes.length, used, []);
  runTick(token);
}

// Junta TODOS los lotes guardados en Firestore para la firma actual en un único
// arreglo (de la palabra 1 a la última) y lo deja en genDisplayResults, que es lo
// que se pinta en pantalla. Así la vista se comporta como si todos los lotes
// fueran uno solo, en vez de mostrar nada más el último tramo guardado.
// Nota: para totales muy grandes (millones) esto puede tardar y usar bastante
// memoria del navegador, ya que arma la lista completa antes de pintarla.
function cargarTodoElHistoricoEnPantalla(token){
  if (!firebaseListo || !db || !genSignature) return;
  // OJO: no se combina .where('firma', ...) con .orderBy('inicio', ...) en la
  // misma consulta porque Firestore exige un índice compuesto para eso, y si
  // no existe la consulta falla en silencio (solo se ve en la consola) y la
  // pantalla se queda vacía. El orden se aplica después, ya en JavaScript.
  db.collection(COLECCION_LOTES)
    .where('firma', '==', genSignature)
    .get()
    .then(snapshot => {
      if (token !== genRunToken) return;
      const partes = [];
      snapshot.forEach(doc => {
        const d = doc.data();
        partes.push({inicio: d.inicio || 0, resultados: d.resultados || []});
      });
      partes.sort((a, b) => a.inicio - b.inicio);
      genDisplayResults = [];
      partes.forEach(p => genDisplayResults.push(...p.resultados));
      renderGenList();
      document.getElementById('btnDownloadAll').style.display = genDisplayResults.length ? 'inline-block' : 'none';
      document.getElementById('btnClear').style.display = genDisplayResults.length ? 'inline-block' : 'none';

      // Si el progreso guardado dice que ya se generó cierto total pero los lotes
      // recuperados no llegan a esa cantidad, es que a esta configuración le
      // faltan lotes en Firestore (por ejemplo, por el borrado automático que
      // existía antes de corregirlo). En vez de dejar la pantalla vacía sin
      // explicación, se avisa y se sugiere usar el reinicio (5 taps al título).
      if (genCumulativeCount > 0 && genDisplayResults.length < genCumulativeCount){
        genEstadoMsg = `<span class="warn">Faltan lotes guardados para esta configuración (se recuperaron ${genDisplayResults.length.toLocaleString('es-MX')} de ${genCumulativeCount.toLocaleString('es-MX')}). Es probable que se hayan perdido antes de una corrección reciente. Toca 5 veces seguidas el título "Descifrador de cadenas binarias" para reiniciar esta configuración en Firebase y generarla de nuevo completa.</span>`;
        renderGenProgress();
      }
    })
    .catch(err => console.warn('No se pudo cargar el histórico completo guardado', err));
}

// ==== Reinicio de Firebase: 5 taps seguidos sobre el título ====
// Borra en Firestore todo lo guardado (lotes + progreso) para la configuración
// actual (misma firma) y arranca la generación de cero. Sirve para el caso en
// que a una firma le falten lotes intermedios (por ejemplo, por el borrado
// automático que existía antes) y la vista se quede incompleta o vacía.
let tituloClicks = 0;
let tituloClickTimer = null;
document.getElementById('tituloApp').addEventListener('click', () => {
  tituloClicks++;
  clearTimeout(tituloClickTimer);
  tituloClickTimer = setTimeout(() => { tituloClicks = 0; }, 2000);
  if (tituloClicks >= 5){
    tituloClicks = 0;
    confirmarReinicioFirebase();
  }
});

function confirmarReinicioFirebase(){
  if (!firebaseListo || !db){
    alert('Firebase no está configurado todavía.');
    return;
  }
  if (!genSignature || !genFirmaId){
    alert('Todavía no hay una configuración activa para reiniciar (analiza una cadena binaria primero).');
    return;
  }
  const ok = confirm('¿Borrar TODO lo guardado en Firebase para esta configuración (letras/números/símbolos elegidos) y empezar de cero?\n\nEsta acción no se puede deshacer.');
  if (ok) reiniciarFirebaseParaFirmaActual();
}

function reiniciarFirebaseParaFirmaActual(){
  const firmaBorrar = genSignature;
  const firmaIdBorrar = genFirmaId;
  const tokenAntes = genRunToken;

  db.collection(COLECCION_LOTES).where('firma', '==', firmaBorrar).get()
    .then(snapshot => {
      const docs = snapshot.docs;
      // Firestore permite máximo 500 operaciones por batch, así que se parte en trozos.
      const chunks = [];
      for (let i = 0; i < docs.length; i += 450) chunks.push(docs.slice(i, i + 450));
      let promesa = Promise.resolve();
      chunks.forEach(chunk => {
        promesa = promesa.then(() => {
          const batch = db.batch();
          chunk.forEach(doc => batch.delete(doc.ref));
          return batch.commit();
        });
      });
      return promesa;
    })
    .then(() => db.collection(COLECCION_PROGRESO).doc(firmaIdBorrar).delete().catch(() => {}))
    .then(() => {
      alert('Datos borrados en Firebase. Empezando de cero…');
      if (genRunToken === tokenAntes) restartGeneration();
    })
    .catch(err => {
      console.error('Error al reiniciar los datos en Firebase', err);
      alert('Error al borrar los datos en Firebase: ' + (err.message || String(err)));
    });
}

function mostrarComoYaCompleto(token, progreso){
  if (token !== genRunToken) return;
  genDone = true;
  genCumulativeCount = progreso.ultimoFin || 0;
  genLotesGuardados = progreso.ultimoLote || 0;
  genEstadoMsg = '';
  renderGenProgress();
  cargarTodoElHistoricoEnPantalla(token);
}

const AVANCE_TICK = 200000; // pasos de avance por ciclo al reanudar, sin bloquear la pestaña

function reanudarDesde(token, avanceObjetivo, ultimoLotePrevio){
  if (token !== genRunToken) return;
  genLoteActual = ultimoLotePrevio;
  genEstadoMsg = 'Retomando progreso guardado anteriormente…';
  renderGenProgress();
  // Muestra de inmediato todo lo ya generado (todos los lotes juntos), sin esperar
  // a que avance la generación ni tener que ir al historial a darle "Ver".
  cargarTodoElHistoricoEnPantalla(token);

  const used = new Array(genPool.length).fill(false);
  genGenerator = permute(genPool, genContext.unassignedCodes.length, used, []);
  avanzarGenerador(token, avanceObjetivo, 0);
}

function avanzarGenerador(token, objetivo, avanzados){
  if (token !== genRunToken) return;
  let hechos = 0;
  while (hechos < AVANCE_TICK && avanzados < objetivo){
    const next = genGenerator.next();
    if (next.done){ genDone = true; break; }
    avanzados++;
    hechos++;
  }
  if (avanzados < objetivo && !genDone){
    setTimeout(() => avanzarGenerador(token, objetivo, avanzados), 0);
    return;
  }
  if (token !== genRunToken) return;
  genCumulativeCount = avanzados;
  genEstadoMsg = '';
  renderGenProgress();
  if (genDone) return;
  runTick(token);
}

function runTick(token){
  if (token !== genRunToken) return; // se canceló por un cambio nuevo
  if (!genGenerator) return;
  if (genGuardando) return; // esperando a que termine el guardado del lote anterior

  const {assignedCodes, unassignedCodes} = genContext;
  let count = 0;
  while (count < TICK_SIZE){
    const next = genGenerator.next();
    if (next.done){ genDone = true; break; }
    const combo = next.value;
    const mapping = {};
    assignedCodes.forEach(c => mapping[c] = state.assign[c]);
    unassignedCodes.forEach((c, i) => mapping[c] = combo[i]);
    const word = state.codes.map(c => mapping[c]).join('');
    genResults.push(word);
    genDisplayResults.push(word);
    genBytesEstimados += (word.length * 2) + 10; // *2 cubre con margen posibles caracteres multibyte (ej. Ñ)
    genCumulativeCount++;
    count++;
    if (genResults.length >= DISPLAY_LIMIT || genBytesEstimados >= FIRESTORE_BATCH_BYTES_LIMIT) break;
  }

  renderGenProgress();
  renderGenList();
  document.getElementById('btnDownloadAll').style.display = genDisplayResults.length ? 'inline-block' : 'none';
  document.getElementById('btnClear').style.display = genDisplayResults.length ? 'inline-block' : 'none';

  if (genDone && genResults.length === 0){
    marcarProgresoCompletoSinNuevoLote(token);
    return;
  }

  if (genResults.length >= DISPLAY_LIMIT || genBytesEstimados >= FIRESTORE_BATCH_BYTES_LIMIT || (genDone && genResults.length > 0)){
    guardarLoteYContinuar(token);
    return;
  }

  if (genDone) return;

  setTimeout(() => runTick(token), 0);
}

function marcarProgresoCompletoSinNuevoLote(token){
  if (!firebaseListo || !db || !genFirmaId) { renderGenProgress(); return; }
  db.collection(COLECCION_PROGRESO).doc(genFirmaId).set({
    completo: true,
    actualizado: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge: true}).then(() => {
    if (token !== genRunToken) return;
    renderGenProgress();
  }).catch(err => {
    console.warn('No se pudo marcar el progreso como completo', err);
    if (token === genRunToken) renderGenProgress();
  });
}

function guardarLoteYContinuar(token){
  if (token !== genRunToken) return;
  genGuardando = true;

  const lote = genResults.slice();
  const finLote = genCumulativeCount;
  const inicioLote = finLote - lote.length + 1;
  genLoteActual++;
  const numeroLote = genLoteActual;

  const seguirSinGuardar = () => {
    // Deja lo generado visible para descargar/copiar manualmente; no continúa solo para no perder datos.
    genGuardando = false;
    document.getElementById('btnDownloadAll').style.display = genDisplayResults.length ? 'inline-block' : 'none';
    document.getElementById('btnClear').style.display = genDisplayResults.length ? 'inline-block' : 'none';
    renderGenProgress();
  };

  const continuarTrasGuardar = () => {
    if (token !== genRunToken) return; // la corrida se canceló mientras se guardaba
    genGuardando = false;
    if (genDone){
      // Ya no hay más que generar: deja visible todo lo generado (no se vacía nada).
      document.getElementById('btnDownloadAll').style.display = genDisplayResults.length ? 'inline-block' : 'none';
      document.getElementById('btnClear').style.display = genDisplayResults.length ? 'inline-block' : 'none';
      renderGenProgress();
      return;
    }
    // Solo se vacía el buffer del lote (para controlar el tamaño del próximo
    // documento en Firestore); la vista en pantalla (genDisplayResults) sigue
    // completa, mostrando todo lo generado hasta ahora.
    genResults = [];
    genBytesEstimados = 0;
    document.getElementById('btnDownloadAll').style.display = genDisplayResults.length ? 'inline-block' : 'none';
    document.getElementById('btnClear').style.display = genDisplayResults.length ? 'inline-block' : 'none';
    setTimeout(() => runTick(token), 0);
  };

  if (!firebaseListo || !db){
    genEstadoMsg = `<span class="warn">Firebase no está configurado todavía (revisa firebaseConfig). Este tramo no se guardó — descárgalo o cópialo antes de seguir.</span>`;
    seguirSinGuardar();
    return;
  }

  genEstadoMsg = 'Guardando progreso…';
  renderGenProgress();

  db.collection(COLECCION_LOTES).add({
    sesion: genSessionId,
    firma: genSignature,
    lote: numeroLote,
    inicio: inicioLote,
    fin: finLote,
    total: lote.length,
    resultados: lote,
    completo: genDone,
    creado: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    if (token !== genRunToken) return; // corrida cancelada, ignorar resultado tardío
    genLotesGuardados++;
    return db.collection(COLECCION_PROGRESO).doc(genFirmaId).set({
      firma: genSignature,
      ultimoLote: numeroLote,
      ultimoFin: finLote,
      completo: genDone,
      totalTeorico: genTotalTheoretical || null,
      actualizado: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge: true});
  }).then(() => {
    if (token !== genRunToken) return;
    genEstadoMsg = '';
    continuarTrasGuardar();
  }).catch(err => {
    console.error('Error guardando lote en Firebase', err);
    if (token !== genRunToken) return;
    genEstadoMsg = `<span class="warn">Error al guardar en Firebase: ${escapeHtml(err.message || String(err))}. Descárgalo o cópialo manualmente.</span>`;
    seguirSinGuardar();
  });
}

function renderGenProgress(){
  const el = document.getElementById('genProgress');
  const totalStr = genTotalTheoretical ? formatBigNumber(genTotalTheoretical) : '?';
  el.innerHTML = `
    <div>Generados en total: <b>${genCumulativeCount.toLocaleString('es-MX')}</b> de <b>${totalStr}</b> posibles
    ${genDone ? ' — <span class="ok">generación completa</span>' : ''}</div>
    ${genEstadoMsg ? `<div class="msg">${genEstadoMsg}</div>` : ''}
  `;
}

function renderGenList(){
  const container = document.getElementById('genResults');
  if (!genDisplayResults.length){
    container.innerHTML = '';
    return;
  }
  // genDisplayResults ya contiene TODO lo generado, de la palabra 1 a la última
  // (todos los lotes juntos), así que el índice es simplemente la posición en
  // esta lista completa.
  const lista = ordenarLista(genDisplayResults);
  let rows = '';
  for (let i = 0; i < lista.length; i++){
    rows += `<tr><td class="idx">${(i + 1).toLocaleString('es-MX')}</td><td>${escapeHtml(lista[i])}</td></tr>`;
  }
  container.innerHTML = `
    <div class="scroll-list">
      <table class="resultTable">
        <thead><tr><th></th><th>Resultado</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function escapeHtml(str){
  return str.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
}

// Descarga TODO lo generado (de la palabra 1 a la última) usando lo que ya
// está acumulado en memoria en genDisplayResults — no hace falta volver a
// consultar Firestore porque esa lista ya se mantiene completa en todo momento.
function descargarTodoCompleto(){
  if (!genDisplayResults.length){
    alert('Todavía no hay resultados generados para descargar.');
    return;
  }
  const todas = ordenarLista(genDisplayResults);
  const blob = new Blob([todas.join('\n')], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `combinaciones_completas_1_a_${todas.length}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copiarGenerados(){
  if (!genDisplayResults.length) return;
  const texto = ordenarLista(genDisplayResults).join('\n');
  const btn = document.getElementById('btnClear');
  const feedback = (ok) => {
    const original = 'Copiar';
    btn.textContent = ok ? '¡Copiado!' : 'No se pudo copiar';
    setTimeout(() => { btn.textContent = original; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(() => feedback(true)).catch(() => feedback(false));
  } else {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      feedback(true);
    } catch (e) {
      feedback(false);
    }
    document.body.removeChild(ta);
  }
}
function bitsActuales(){
  const bits = parseInt(document.getElementById('inBits').value, 10);
  return (bits && bits >= 1 && bits <= 16) ? bits : null;
}

function actualizarPlaceholderBin(){
  const bits = bitsActuales();
  const inBin = document.getElementById('inBin');
  if (bits){
    const ejemplos = [];
    for (let i = 0; i < 4; i++){
      ejemplos.push(i.toString(2).padStart(bits, '0'));
    }
    inBin.placeholder = ejemplos.join(' ') + ' ...';
  } else {
    inBin.placeholder = '0000 0001 0010 0011 ...';
  }
}

function reformatearBin(preservarCursor){
  const ta = document.getElementById('inBin');
  const start = preservarCursor ? ta.selectionStart : null;

  let permitidosAntesCursor = 0;
  if (preservarCursor){
    for (let i = 0; i < start; i++){
      if (ta.value[i] === '0' || ta.value[i] === '1' || ta.value[i] === ' ') permitidosAntesCursor++;
    }
  }

  // Solo se permiten 0, 1 y espacio. El espaciado entre grupos lo pone el usuario a mano,
  // aquí solo se evita que queden dos o más espacios seguidos.
  const formateado = ta.value.replace(/[^01 ]/g, '').replace(/ {2,}/g, ' ');

  ta.value = formateado;

  if (preservarCursor){
    const nuevaPos = Math.min(permitidosAntesCursor, formateado.length);
    ta.setSelectionRange(nuevaPos, nuevaPos);
  }
}

// ==== Persistencia local de los parámetros (para que sobreviva a recargar la página) ====
// El progreso real de la generación vive en Firebase (por firma); esto solo recuerda
// qué escribiste para que, al recargar, se reanude solo sin tener que volver a teclear nada.
const LOCAL_PARAMS_KEY = 'descifrador_parametros_v1';

function guardarParametrosLocales(){
  try {
    const datos = {
      inBin: document.getElementById('inBin').value,
      inBits: document.getElementById('inBits').value,
      inUnique: document.getElementById('inUnique').value,
      inTotal: document.getElementById('inTotal').value,
      inLang: document.getElementById('inLang').value,
      chkLetras: document.getElementById('chkLetras').checked,
      chkNumeros: document.getElementById('chkNumeros').checked,
      chkSimbolos: document.getElementById('chkSimbolos').checked,
      chkEspacio: document.getElementById('chkEspacio').checked,
      ordenResultados: ordenResultados
    };
    localStorage.setItem(LOCAL_PARAMS_KEY, JSON.stringify(datos));
  } catch (e){
    console.warn('No se pudieron guardar los parámetros localmente', e);
  }
}

function cargarParametrosLocales(){
  let datos = null;
  try {
    const raw = localStorage.getItem(LOCAL_PARAMS_KEY);
    if (raw) datos = JSON.parse(raw);
  } catch (e){
    console.warn('No se pudieron leer los parámetros guardados localmente', e);
  }
  if (!datos) return false;

  if (typeof datos.inBin === 'string') document.getElementById('inBin').value = datos.inBin;
  if (typeof datos.inBits === 'string') document.getElementById('inBits').value = datos.inBits;
  if (typeof datos.inUnique === 'string') document.getElementById('inUnique').value = datos.inUnique;
  if (typeof datos.inTotal === 'string') document.getElementById('inTotal').value = datos.inTotal;
  if (typeof datos.inLang === 'string') document.getElementById('inLang').value = datos.inLang;
  if (typeof datos.chkLetras === 'boolean') document.getElementById('chkLetras').checked = datos.chkLetras;
  if (typeof datos.chkNumeros === 'boolean') document.getElementById('chkNumeros').checked = datos.chkNumeros;
  if (typeof datos.chkSimbolos === 'boolean') document.getElementById('chkSimbolos').checked = datos.chkSimbolos;
  if (typeof datos.chkEspacio === 'boolean') document.getElementById('chkEspacio').checked = datos.chkEspacio;
  if (datos.ordenResultados === 'orden' || datos.ordenResultados === 'coherencia'){
    ordenResultados = datos.ordenResultados;
    const selGen = document.getElementById('inOrdenGen');
    if (selGen) selGen.value = ordenResultados;
  }

  return !!(datos.inBin && datos.inBin.replace(/[^01]/g, '').length);
}

const HISTORIAL_PAGINA = 20;
let historialUltimoDoc = null;
let historialCargando = false;
let historialLoteActual = null;

function filaHistorial(doc){
  const d = doc.data();
  const fecha = (d.creado && d.creado.toDate) ? d.creado.toDate().toLocaleString('es-MX') : '—';
  const inicio = d.inicio || 0;

    <td>#${escapeHtml(String(d.lote || '?'))}</td>

}

function tablaHistorial(filas){
  return `
    <div class="scroll-list">
      <table class="resultTable">
        <thead><tr><th>Fecha</th><th>Lote</th><th>Rango</th><th>Total</th><th></th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>`;
}

// Escucha en vivo: la primera página del historial se mantiene siempre actualizada sola,
// sin necesidad de un botón de refrescar.
function iniciarHistorialEnVivo(){
  const liveBox = document.getElementById('historialListLive');
  if (!firebaseListo || !db){
    liveBox.innerHTML = '<div class="msg warn">Firebase no está configurado todavía.</div>';
    return;
  }
  if (historialUnsub) { historialUnsub(); historialUnsub = null; }
  liveBox.innerHTML = '<div class="msg">Cargando…</div>';

  historialUnsub = db.collection(COLECCION_LOTES)
    .orderBy('creado', 'desc')
    .limit(HISTORIAL_PAGINA)
    .onSnapshot(snapshot => {
      if (snapshot.empty){
        document.getElementById('btnMasHistorial').style.display = 'none';
        liveBox.innerHTML = '<div class="msg">Todavía no hay lotes guardados.</div>';
        return;
      }
      historialUltimoDoc = snapshot.docs[snapshot.docs.length - 1];
      let filas = '';
      snapshot.forEach(doc => { filas += filaHistorial(doc); });
      liveBox.innerHTML = tablaHistorial(filas);
      document.getElementById('btnMasHistorial').style.display = 'inline-block';
    }, err => {
      liveBox.innerHTML = `<div class="msg warn">Error cargando historial: ${escapeHtml(err.message || String(err))}</div>`;
    });
}

function cargarHistorial(reiniciar){
  if (reiniciar){
    iniciarHistorialEnVivo();
    return;
  }
  const extra = document.getElementById('historialListExtra');
  if (!firebaseListo || !db){
    extra.innerHTML = '<div class="msg warn">Firebase no está configurado todavía.</div>';
    return;
  }
  if (historialCargando) return;
  historialCargando = true;

  let query = db.collection(COLECCION_LOTES).orderBy('creado', 'desc').limit(HISTORIAL_PAGINA);
  if (historialUltimoDoc){ query = query.startAfter(historialUltimoDoc); }

  query.get().then(snapshot => {
    historialCargando = false;
    if (snapshot.empty){
      document.getElementById('btnMasHistorial').style.display = 'none';
      return;
    }
    historialUltimoDoc = snapshot.docs[snapshot.docs.length - 1];

    let filas = '';
    snapshot.forEach(doc => { filas += filaHistorial(doc); });
    extra.innerHTML += tablaHistorial(filas);
    document.getElementById('btnMasHistorial').style.display = 'inline-block';
  }).catch(err => {
    historialCargando = false;
    extra.innerHTML += `<div class="msg warn">Error cargando más historial: ${escapeHtml(err.message || String(err))}</div>`;
  });
}

function verLoteHistorial(id){
  db.collection(COLECCION_LOTES).doc(id).get().then(doc => {
    if (!doc.exists) return;
    const d = doc.data();
    const resultados = d.resultados || [];
    historialLoteActual = {resultados, inicio: d.inicio || 0, fin: d.fin || 0, lote: d.lote};
    renderHistorialVista();
    document.getElementById('historialVista').scrollIntoView({behavior:'smooth'});
  }).catch(err => {
    document.getElementById('historialVista').innerHTML = `<div class="msg warn">Error al cargar el lote: ${escapeHtml(err.message || String(err))}</div>`;
  });
}

function renderHistorialVista(){
  if (!historialLoteActual) return;
  const d = historialLoteActual;
  const lista = ordenarLista(d.resultados);
  const enOrdenOriginal = ordenResultados !== 'coherencia';

  let rows = '';
  for (let i = 0; i < lista.length; i++){
    const idxLabel = enOrdenOriginal ? ((d.inicio || 0) + i) : (i + 1);
    rows += `<tr><td class="idx">${idxLabel}</td><td>${escapeHtml(lista[i])}</td></tr>`;
  }
  document.getElementById('historialVista').innerHTML = `
    <div class="gen-summary">
      Lote #${escapeHtml(String(d.lote))} — rango ${(d.inicio||0).toLocaleString('es-MX')}–${(d.fin||0).toLocaleString('es-MX')}
      (${lista.length.toLocaleString('es-MX')} resultados)
    </div>
    <div class="btn-row" style="align-items:center;">
      <label style="font-size:.82rem;color:var(--dim);">Ordenar por:</label>
      <select id="inOrdenHistorial" onchange="cambiarOrden(this.value)">
        <option value="orden" ${enOrdenOriginal ? 'selected' : ''}>Generación (A-Z)</option>
        <option value="coherencia" ${!enOrdenOriginal ? 'selected' : ''}>Coherencia en español</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="secondary" onclick="descargarLoteHistorial()">Descargar este lote</button>
      <button class="secondary" onclick="copiarLoteHistorial()">Copiar</button>
    </div>
    <div class="scroll-list">
      <table class="resultTable">
        <thead><tr><th></th><th>Resultado</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function descargarLoteHistorial(){
  if (!historialLoteActual) return;
  const blob = new Blob([ordenarLista(historialLoteActual.resultados).join('\n')], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `historial_${historialLoteActual.inicio}_a_${historialLoteActual.fin}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copiarLoteHistorial(){
  if (!historialLoteActual) return;
  const texto = ordenarLista(historialLoteActual.resultados).join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto);
  }
}

if (firebaseListo){ iniciarHistorialEnVivo(); }
</script>
